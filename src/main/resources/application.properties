spring.application.name=oneiric

# Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:oneiric}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:MEHROOF}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Port for Railway
server.port=${PORT:8080}

# JPA & Hibernate (Let Hibernate 7 auto-detect the dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
