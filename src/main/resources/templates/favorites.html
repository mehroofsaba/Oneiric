<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <title>Oneiric — Favorites</title>
    <style>

        :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #6e6858;
            --accent: #d4b478;
            --accent-hover: #c29a5c;
            --accent-dim: rgba(212,180,120,0.1);
            --accent-glow: rgba(212,180,120,0.2);
            --border: #2e2e2e;
            --border-accent: rgba(212,180,120,0.25);
            --cloud-r: 200; --cloud-g: 160; --cloud-b: 90;
            --star-color: #d4b478;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0; --bg-secondary: #fff0f3; --bg-tertiary: #ffe4ec;
            --text: #4a3040; --text-muted: #9e7080; --text-subtle: #c4a0b0;
            --accent: #e8829a; --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08); --accent-glow: rgba(232,130,154,0.18);
            --border: #f0c0d0; --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154; --star-color: #e8829a;
        }

        [data-theme="abyss"] {
            --bg: #050d1a; --bg-secondary: #0a1628; --bg-tertiary: #0f1e35;
            --text: #c8d8f0; --text-muted: #7090b8; --text-subtle: #3a5070;
            --accent: #7eb8e8; --accent-hover: #5a9fd4;
            --accent-dim: rgba(126,184,232,0.08); --accent-glow: rgba(126,184,232,0.18);
            --border: #1a2e48; --border-accent: rgba(126,184,232,0.2);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180; --star-color: #7eb8e8;
        }

        [data-theme="sage"] {
            --bg: #f4f6f0; --bg-secondary: #eaefe4; --bg-tertiary: #dde5d4;
            --text: #2d3828; --text-muted: #6e8060; --text-subtle: #a0b090;
            --accent: #7a9e6e; --accent-hover: #5e8050;
            --accent-dim: rgba(122,158,110,0.08); --accent-glow: rgba(122,158,110,0.18);
            --border: #c8d8b8; --border-accent: rgba(122,158,110,0.3);
            --cloud-r: 122; --cloud-g: 158; --cloud-b: 110; --star-color: #7a9e6e;
        }

        [data-theme="noir"] {
            --bg: #000000; --bg-secondary: #0a0a0a; --bg-tertiary: #141414;
            --text: #ffffff; --text-muted: #888888; --text-subtle: #444444;
            --accent: #ffffff; --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05); --accent-glow: rgba(255,255,255,0.12);
            --border: #222222; --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200; --star-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 60px 40px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        canvas.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .corner-deco {
            position: fixed;
            width: 160px; height: 160px;
            opacity: 0.14;
            pointer-events: none;
            z-index: 0;
        }
        .corner-deco svg { width: 100%; height: 100%; fill: var(--accent); }
        .corner-deco.tl { top: 0; left: 0; }
        .corner-deco.tr { top: 0; right: 0; transform: scaleX(-1); }
        .corner-deco.bl { bottom: 0; left: 0; transform: scaleY(-1); }
        .corner-deco.br { bottom: 0; right: 0; transform: scale(-1); }

        .hang-star {
            position: fixed; top: 0;
            color: var(--accent);
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            animation: sway var(--dur) ease-in-out infinite var(--del);
        }
        .hang-star .line {
            width: 1px; height: var(--len);
            background: linear-gradient(180deg, transparent, var(--accent) 200%);
            opacity: 0.4;
        }
        .hang-star .star { font-size: var(--sz); animation: twinkle var(--tdur) ease-in-out infinite var(--tdel); }

        @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .corner-star {
            position: fixed; bottom: 30px; right: 30px;
            font-size: 2.5rem; color: var(--accent);
            opacity: 0.2; pointer-events: none; z-index: 1;
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }

        .header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            row-gap: 14px;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: 0.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 svg { width: 0.85em; height: 0.85em; fill: none; stroke: var(--accent); stroke-width: 1.8; }

        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
        }
        .nav-links a svg { width: 1em; height: 1em; flex-shrink: 0; }
        .nav-links a:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

        .empty {
            position: relative; z-index: 2;
            text-align: center;
            color: var(--text-muted);
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .empty svg { width: 42px; height: 42px; fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: 0.6; }
        .empty p { font-size: 0.95rem; }
        .empty .empty-sub { color: var(--text-subtle); font-size: 0.82rem; }

        .entry-card {
            position: relative;
            z-index: 2;
            background-color: color-mix(in srgb, var(--bg-secondary) 45%, transparent);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid var(--border-accent);
            border-radius: 10px;
            padding: 22px 24px;
            margin-bottom: 18px;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        .entry-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
            transform: translateY(-2px);
        }

        .entry-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .entry-card h2 { color: var(--accent); font-size: 1.15rem; margin-bottom: 6px; line-height: 1.3; }
        .entry-card .date { color: var(--text-subtle); font-size: 0.78rem; margin-bottom: 10px; }

        .mood-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 14px;
            background: var(--accent-dim);
            border: 1px solid var(--border-accent);
            color: var(--accent);
            font-size: 0.76rem;
            margin-bottom: 10px;
        }

        .entry-card p.preview { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 16px; }

        .fav-btn {
            flex-shrink: 0;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .fav-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; transition: fill 0.2s, stroke 0.2s; }
        .fav-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .fav-btn.is-fav { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
        .fav-btn.is-fav svg { fill: var(--accent); }

        .entry-actions { display: flex; gap: 18px; align-items: center; }

        a.edit-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 0.82rem;
            transition: color 0.2s;
            color: var(--text-muted);
        }
        a.edit-link svg { width: 0.95em; height: 0.95em; fill: none; stroke: currentColor; stroke-width: 1.8; }
        a.edit-link:hover { color: var(--accent); }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            body { padding: 32px 18px; }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                margin-bottom: 28px;
            }

            .nav-links { width: 100%; gap: 8px; }
            .nav-links a { flex: 1 1 0; min-width: 0; padding: 9px 10px; font-size: 0.78rem; }

            .entry-card { padding: 18px; }
            .entry-card h2 { font-size: 1.05rem; }
            .entry-card-top { gap: 8px; }
            .fav-btn { width: 30px; height: 30px; }

            .entry-actions { gap: 14px; flex-wrap: wrap; }

            .corner-deco { width: 100px; height: 100px; }
            .corner-star { font-size: 1.6rem; bottom: 16px; right: 16px; }
            .hang-star { display: none; }
        }
    </style>
</head>
<body>

    <canvas class="bg" id="bg"></canvas>

    <div class="corner-deco tl">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10 A30 30 0 1 0 40 70 A24 24 0 1 1 40 10Z"/>
            <path d="M90 25 L93 33 L101 36 L93 39 L90 47 L87 39 L79 36 L87 33Z"/>
            <path d="M115 55 L117 60 L122 62 L117 64 L115 69 L113 64 L108 62 L113 60Z"/>
        </svg>
    </div>
    <div class="corner-deco tr">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10 A30 30 0 1 0 40 70 A24 24 0 1 1 40 10Z"/>
            <path d="M90 25 L93 33 L101 36 L93 39 L90 47 L87 39 L79 36 L87 33Z"/>
            <path d="M115 55 L117 60 L122 62 L117 64 L115 69 L113 64 L108 62 L113 60Z"/>
        </svg>
    </div>
    <div class="corner-deco bl">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10 A30 30 0 1 0 40 70 A24 24 0 1 1 40 10Z"/>
            <path d="M90 25 L93 33 L101 36 L93 39 L90 47 L87 39 L79 36 L87 33Z"/>
            <path d="M115 55 L117 60 L122 62 L117 64 L115 69 L113 64 L108 62 L113 60Z"/>
        </svg>
    </div>
    <div class="corner-deco br">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 10 A30 30 0 1 0 40 70 A24 24 0 1 1 40 10Z"/>
            <path d="M90 25 L93 33 L101 36 L93 39 L90 47 L87 39 L79 36 L87 33Z"/>
            <path d="M115 55 L117 60 L122 62 L117 64 L115 69 L113 64 L108 62 L113 60Z"/>
        </svg>
    </div>

    <div style="position:fixed; bottom:0; left:0; z-index:1; pointer-events:none; width:280px; height:320px; opacity:0.16;">
        <svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" width="280" height="320">
            <path d="M60 320 C65 280 55 240 70 200 C80 170 75 140 85 110" stroke="var(--accent)" stroke-width="1.5" fill="none" opacity="0.8"/>
            <path d="M60 320 C45 285 30 260 25 230 C20 205 15 185 20 165" stroke="var(--accent)" stroke-width="1.2" fill="none" opacity="0.6"/>
            <path d="M60 320 C75 295 90 275 100 250 C110 228 108 205 115 185" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.5"/>
            <g transform="translate(80,108) rotate(-15)">
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7"/>
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7" transform="rotate(60)"/>
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7" transform="rotate(120)"/>
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7" transform="rotate(180)"/>
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7" transform="rotate(240)"/>
                <ellipse cx="0" cy="-14" rx="6" ry="14" fill="var(--accent)" opacity="0.7" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="5" fill="var(--accent)" opacity="0.9"/>
            </g>
            <g transform="translate(18,163) rotate(10)">
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65"/>
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65" transform="rotate(60)"/>
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65" transform="rotate(120)"/>
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65" transform="rotate(180)"/>
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65" transform="rotate(240)"/>
                <ellipse cx="0" cy="-12" rx="5" ry="12" fill="var(--accent)" opacity="0.65" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="4" fill="var(--accent)" opacity="0.9"/>
            </g>
            <path d="M70 200 C85 190 100 192 105 180 C95 178 80 182 70 200Z" fill="var(--accent)" opacity="0.5"/>
            <path d="M72 240 C55 228 42 232 38 218 C52 215 66 220 72 240Z" fill="var(--accent)" opacity="0.45"/>
        </svg>
    </div>

    <div class="hang-star" style="left:8%; --dur:4s; --del:0s; --len:80px; --sz:1.2rem; --tdur:2s; --tdel:0s;"><div class="line"></div><div class="star">✦</div></div>
    <div class="hang-star" style="left:15%; --dur:5s; --del:0.5s; --len:120px; --sz:0.9rem; --tdur:3s; --tdel:0.5s;"><div class="line"></div><div class="star">✧</div></div>
    <div class="hang-star" style="left:22%; --dur:4.5s; --del:1s; --len:60px; --sz:1rem; --tdur:2.5s; --tdel:1s;"><div class="line"></div><div class="star">★</div></div>
    <div class="hang-star" style="right:8%; --dur:4s; --del:0.3s; --len:90px; --sz:1.2rem; --tdur:2s; --tdel:0.3s;"><div class="line"></div><div class="star">✦</div></div>
    <div class="hang-star" style="right:16%; --dur:5s; --del:0.8s; --len:110px; --sz:0.9rem; --tdur:3s; --tdel:0.8s;"><div class="line"></div><div class="star">✧</div></div>
    <div class="hang-star" style="right:24%; --dur:4.5s; --del:1.2s; --len:65px; --sz:1rem; --tdur:2.5s; --tdel:1.2s;"><div class="line"></div><div class="star">★</div></div>

    <div class="corner-star">✦</div>

    <div class="header">
        <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8"><path d="M12 17.3l-6.16 3.6 1.64-6.99L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.48 4.67 1.64 6.99z"/></svg>
            Favorites
        </h1>
        <div class="nav-links">
            <a href="/chamber">
                <svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                Chamber
            </a>
            <a href="/entries">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15.5"/></svg>
                Entries
            </a>
            <a href="/entries/trash">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                Trash
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(entries)}" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.3"><path d="M12 17.3l-6.16 3.6 1.64-6.99L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.48 4.67 1.64 6.99z"/></svg>
        <p>No favorites yet.</p>
        <span class="empty-sub">Star the entries you want to find again quickly.</span>
    </div>

    <div th:each="entry : ${entries}" class="entry-card">
        <div class="entry-card-top">
            <div style="flex:1; min-width:0;">
                <h2 th:text="${entry.title}"></h2>
                <p class="date">
                    Created: <span th:text="${#temporals.format(entry.createdAt, 'dd MMM yyyy, HH:mm')}"></span>
                    &nbsp;·&nbsp;
                    Edited: <span th:text="${#temporals.format(entry.updatedAt, 'dd MMM yyyy, HH:mm')}"></span>
                </p>
            </div>
            <form th:action="@{/entries/{id}/favorite(id=${entry.id})}" method="post">
                <button type="submit" class="fav-btn is-fav" title="Remove from favorites">
                    <svg viewBox="0 0 24 24"><path d="M12 17.3l-6.16 3.6 1.64-6.99L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.48 4.67 1.64 6.99z"/></svg>
                </button>
            </form>
        </div>

        <p th:if="${entry.mood != null}" class="mood-pill">
            <span th:switch="${entry.mood}">
                <span th:case="'happy'">(❁´◡`❁) Happy</span>
                <span th:case="'calm'">^_^ Calm</span>
                <span th:case="'sad'">＞︿＜ Sad</span>
                <span th:case="'anxious'">＞﹏＜ Anxious</span>
                <span th:case="'angry'">(╬▔皿▔)╯ Angry</span>
                <span th:case="'lonely'">( ﾉ ﾟｰﾟ)ﾉ Lonely</span>
                <span th:case="'excited'">(≧∀≦)ゞ Excited</span>
                <span th:case="'confused'">*-* Confused</span>
                <span th:case="'neutral'">^_____^ Neutral</span>
                <span th:case="'bored'">–_– Bored</span>
            </span>
        </p>

        <p class="preview" th:text="${#strings.abbreviate(entry.content, 150)}"></p>

        <div class="entry-actions">
            <a th:href="@{/entries/{id}/edit(id=${entry.id})}" class="edit-link">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                Edit
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const w = canvas.width, h = canvas.height;

        function themeVals() {
            const style = getComputedStyle(document.documentElement);
            return {
                r: style.getPropertyValue('--cloud-r').trim() || '200',
                g: style.getPropertyValue('--cloud-g').trim() || '160',
                b: style.getPropertyValue('--cloud-b').trim() || '90',
            };
        }

        function drawCloud(x, y, size) {
            const { r, g, b } = themeVals();
            [[0,0,size],[size*.6,-size*.2,size*.75],[-size*.5,-size*.1,size*.7],
             [size*.2,-size*.5,size*.6],[-size*.2,-size*.55,size*.55]
            ].forEach(([cx,cy,r2]) => {
                const grad = ctx.createRadialGradient(x+cx,y+cy,0,x+cx,y+cy,r2);
                grad.addColorStop(0, `rgba(${r},${g},${b},0.24)`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x+cx, y+cy, r2, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawClouds() {
            ctx.clearRect(0, 0, w, h);
            drawCloud(0, 0, 200);
            drawCloud(w*0.12, 0, 150);
            drawCloud(w, 0, 200);
            drawCloud(w*0.88, 0, 150);
            drawCloud(w, h, 140);
            drawCloud(0, h, 140);
        }

        const particles = [];
        const PARTICLE_COUNT = 28;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 6 + 2,
                speedX: Math.random() * 0.4 - 0.2,
                speedY: Math.random() * 0.5 + 0.2,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.02,
                opacity: Math.random() * 0.4 + 0.15,
                sway: Math.random() * Math.PI * 2,
            });
        }

        function drawParticles() {
            const theme = document.documentElement.getAttribute('data-theme');
            const isSakura = theme === 'sakura';

            particles.forEach(p => {
                p.sway += 0.007;
                p.x += p.speedX * 0.4 + Math.sin(p.sway) * 0.25;
                p.y += p.speedY * 0.35;
                p.rotation += p.rotationSpeed * 0.5;
                if (p.y > h + 15) { p.y = -15; p.x = Math.random() * w; }
                if (p.x > w + 15) p.x = -15;
                if (p.x < -15) p.x = w + 15;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.globalAlpha = p.opacity;

                if (isSakura) {
                    ctx.fillStyle = 'rgba(240,140,170,0.9)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size * 0.5, p.size * 0.9, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = `rgba(212,180,120,${p.opacity})`;
                    ctx.lineWidth = 1;
                    const s = p.size * 0.6;
                    ctx.beginPath();
                    ctx.moveTo(0, -s); ctx.lineTo(0, s);
                    ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        function loop() {
            drawClouds();
            drawParticles();
            requestAnimationFrame(loop);
        }
        loop();
    </script>

</body>
