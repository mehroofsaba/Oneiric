<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Your Secret Chamber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .chamber {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 0.3rem;
            color: #c9a96e;
        }

        p {
            font-size: 1.1rem;
            color: #9e9589;
            letter-spacing: 0.05rem;
        }
    </style>
</head>
<body>
    <div class="chamber">
        <h1>🌙 Oneiric</h1>
        <p>the secret chamber awaits.</p>
    </div>
</body>
