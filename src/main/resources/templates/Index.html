<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    // Apply saved theme immediately to prevent flash
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
</script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oneiric — a private space for your thoughts, feelings, memories, and dreams.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23c9a96e%22><path d=%22M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z%22/></svg>">
    <title>Oneiric — Your Secret Chamber</title>
    <style>
    
            :root {
    --bg: #0d0d0d;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --text: #e8e0d0;
    --text-muted: #9e9589;
    --text-subtle: #555;
    --accent: #c9a96e;
    --accent-hover: #b8935a;
    --accent-dim: rgba(201,169,110,0.08);
    --border: #2e2e2e;
    --border-accent: rgba(201,169,110,0.2);
    --cloud-r: 180; --cloud-g: 140; --cloud-b: 80;

    /* Non-themed extras used only by index.html markup */
    --gold: #c9a96e;
    --gold-hover: #b8935a;
    --gold-active: #a8824c;
    --gold-light: #e8d5ae;
    --border-muted: #4a4438;
    --btn-secondary-text: #c9bfae;
}

        [data-theme="sakura"] {
            --bg: #fdf6f0;
            --bg-secondary: #fff0f3;
            --bg-tertiary: #ffe4ec;
            --text: #4a3040;
            --text-muted: #9e7080;
            --text-subtle: #c4a0b0;
            --accent: #e8829a;
            --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --border: #f0c0d0;
            --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #7090b8;
            --text-subtle: #3a5070;
            --accent: #7eb8e8;
            --accent-hover: #5a9fd4;
            --accent-dim: rgba(126,184,232,0.08);
            --border: #1a2e48;
            --border-accent: rgba(126,184,232,0.2);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180;
        }

 [data-theme="sage"] {
    --bg: #F5E3DF;
    --bg-secondary: #F0D9D4;
    --bg-tertiary: #E3BEB8;

    --text: #4A3040;
    --text-muted: #806477;
    --text-subtle: #B99BAA;

    --accent: #B8955A;
    --accent-hover: #A27F4B;
    --accent-dim: rgba(184,149,90,0.12);

    --border: #D9B9BD;
    --border-accent: rgba(184,149,90,0.28);

    --cloud-r: 210; 
    --cloud-g: 120;
    --cloud-b: 120;

    --star-color: #B8955A;
} 
        
        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --text-subtle: #444444;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --border: #222222;
            --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
        }
    

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::selection {
            background: rgba(201, 169, 110, 0.35);
            color: #f5efe3;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;

    background: radial-gradient(
        ellipse at center,
        rgba(255, 248, 244, 0.18) 0%,
        rgba(255, 248, 244, 0.06) 38%,
        transparent 68%
    );
}

        /* ── Loader / entrance overlay ── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            transition: opacity 0.7s ease, visibility 0.7s ease;
            opacity: 1;
            visibility: visible;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #loader svg {
            width: 3rem;
            height: 3rem;
            animation: loaderPulse 1.4s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 0.35; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @media (prefers-reduced-motion: reduce) {
            #loader { transition: opacity 0.2s linear; }
            #loader svg { animation: none; opacity: 0.8; }
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: transform 0.3s ease-out;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.3s ease-out;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.8); }
            50% { opacity: var(--opacity); transform: scale(1.15); }
        }

        .moon-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            transition: transform 0.3s ease-out;
        }

        .moon-deco {
            position: absolute;
            font-size: var(--size);
            opacity: 0.12;
            pointer-events: none;
            animation: float var(--fduration) ease-in-out infinite var(--fdelay);
        }

        .moon-deco.symbol {
            color: var(--accent);
            font-family: Georgia, serif;
            line-height: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(var(--rot)); }
            50% { transform: translateY(-12px) rotate(var(--rot)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .star { animation: none; opacity: var(--opacity, 0.3); }
            .moon-deco { animation: none; }
            canvas, .stars, .moon-layer, .botanical-corner { transition: none !important; transform: none !important; }
        }

        .chamber {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 0 24px;
            margin-top: 32px;
            opacity: 0;
            transition: transform 0.3s ease-out;
        }

        body.loaded .chamber {
            animation: riseIn 0.8s ease-out forwards;
        }

        @keyframes riseIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .chamber { opacity: 1; }
            body.loaded .chamber { animation: none; }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 10px;
        }

        .logo svg {
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
        }

        h1 { font-size: 3.5rem; letter-spacing: 0.15rem; color: var(--accent); font-weight: 600; }
        p { font-size: 1.05rem; color: var(--text-muted); letter-spacing: 0.05rem; }

        .subtext {
            font-size: 0.9rem;
            color: var(--text-subtle);
            letter-spacing: 0.02rem;
            margin-top: -12px;
            max-width: 520px;
        }

        .actions { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }

        a.btn {
            padding: 10px 28px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent);
            color: var(--bg);
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        @media (hover: hover) {
            a.btn:hover {
                background-color: var(--accent);
                transform: translateY(-1px);
            }
            a.btn.secondary:hover {
                border-color: var(--gold);
                color: var(--gold);
                background-color: rgba(201, 169, 110, 0.06);
                transform: translateY(-1px);
            }
        }

        a.btn:active {
            transform: translateY(0px) scale(0.97);
            background-color: var(--gold-active);
        }

        a.btn:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 3px;
        }

        a.btn.secondary {
            background-color: transparent;
            border: 1px solid var(--border-muted);
            color: var(--btn-secondary-text);
        }

        a.btn.secondary:active {
            transform: translateY(0px) scale(0.97);
            background-color: rgba(201, 169, 110, 0.12);
        }

        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-subtle);
            opacity: 0.6;
            letter-spacing: 0.03rem;
            z-index: 2;
            pointer-events: none;
        }

        /* ── Botanical corner deco ── */
        .botanical-corner {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.3s ease-out;
        }

        .botanical-inner {
            opacity: 0;
        }

        body.loaded .botanical-inner {
            animation: botanicalFadeIn 1.2s ease-out 0.25s forwards;
        }

        @keyframes botanicalFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .botanical-corner svg {
            display: block;
        }

        /* bottom-right flowers */
        .botanical-br {
            bottom: 0;
            right: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .botanical-inner { opacity: 1; }
            body.loaded .botanical-inner { animation: none; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            .logo svg { width: 2.2rem; height: 2.2rem; }
            p { font-size: 0.95rem; }
            .subtext { font-size: 0.82rem; max-width: 300px; }
            .actions { flex-direction: column; width: 100%; max-width: 280px; }
            a.btn { width: 100%; text-align: center; padding: 12px 20px; }
            .botanical-corner { display: none; }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        // ---------- Randomness helpers ----------
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function softRand(min, max, samples = 3) {
            let sum = 0;
            for (let i = 0; i < samples; i++) sum += Math.random();
            return min + (sum / samples) * (max - min);
        }

        const GOLD_TONES = ['#c9a96e', '#d4b483', '#b8935a', '#e2c99a', '#c2a878'];
        const BRIGHT_TONES = ['#f5efe3', '#fff8e7', '#eadfc4'];

        function drawCloud(x, y, size, alpha) {
            const style = getComputedStyle(document.documentElement);
            const r = style.getPropertyValue('--cloud-r').trim() || '180';
            const g = style.getPropertyValue('--cloud-g').trim() || '140';
            const b = style.getPropertyValue('--cloud-b').trim() || '80';
            const circles = [
                [0, 0, size],
                [size*0.6, -size*0.2, size*0.75],
                [-size*0.5, -size*0.1, size*0.7],
                [size*0.2, -size*0.5, size*0.6],
                [-size*0.2, -size*0.55, size*0.55],
            ];
            circles.forEach(([cx, cy, r2]) => {
                const grad = ctx.createRadialGradient(x+cx, y+cy, 0, x+cx, y+cy, r2);
                grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x+cx, y+cy, r2, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawSparkle(x, y, size, alpha) {
            const style = getComputedStyle(document.documentElement);
            const r = style.getPropertyValue('--cloud-r').trim() || '201';
            const g = style.getPropertyValue('--cloud-g').trim() || '169';
            const b = style.getPropertyValue('--cloud-b').trim() || '110';
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y-size); ctx.lineTo(x, y+size);
            ctx.moveTo(x-size, y); ctx.lineTo(x+size, y);
            ctx.moveTo(x-size*0.6, y-size*0.6); ctx.lineTo(x+size*0.6, y+size*0.6);
            ctx.moveTo(x+size*0.6, y-size*0.6); ctx.lineTo(x-size*0.6, y+size*0.6);
            ctx.stroke();
            ctx.restore();
        }
        
        function drawScene() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            drawCloud(0, h, 135, 0.13);
            drawCloud(w*0.15, h, 105, 0.13);
            drawCloud(w, h, 135, 0.13);
            drawCloud(w*0.85, h, 105, 0.13);
            drawCloud(0, 0, 120, 0.13);
            drawCloud(w*0.12, 0, 90, 0.13);
            drawCloud(w, 0, 120, 0.13);
            drawCloud(w*0.88, 0, 90, 0.13);

            // original random sparkles
            const sparkleCount = Math.floor(rand(11, 15));
            for (let i = 0; i < sparkleCount; i++) {
                const x = rand(0, w);
                const y = rand(0, h);
                const size = softRand(2.5, 6.5);
                const alpha = softRand(0.35, 0.75);
                drawSparkle(x, y, size, alpha);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawScene();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- Twinkling stars (Layer 1) ----------
        const starsContainer = document.getElementById('stars');
        const STAR_COUNT = 55;

        const clusterCount = Math.floor(rand(4, 7));
        const clusters = Array.from({ length: clusterCount }, () => ({
            top: rand(5, 95),
            left: rand(5, 95),
            spread: rand(10, 26),
        }));

        for (let i = 0; i < STAR_COUNT; i++) {
            const star = document.createElement('div');
            star.classList.add('star');

            let top, left;
            if (Math.random() < 0.65) {
                const c = clusters[Math.floor(Math.random() * clusters.length)];
                top = Math.min(98, Math.max(1, c.top + (softRand(-1, 1, 3) * c.spread)));
                left = Math.min(98, Math.max(1, c.left + (softRand(-1, 1, 3) * c.spread)));
            } else {
                top = rand(0, 100);
                left = rand(0, 100);
            }

            const sizeRoll = Math.random();
            let size, isHero = false;
            if (sizeRoll > 0.94) {
                size = rand(3, 4.2);
                isHero = true;
            } else if (sizeRoll > 0.75) {
                size = rand(2, 2.8);
            } else {
                size = rand(0.8, 1.8);
            }

            const opacity = isHero ? rand(0.75, 1) : softRand(0.08, 0.55);
            const color = isHero
                ? BRIGHT_TONES[Math.floor(Math.random() * BRIGHT_TONES.length)]
                : GOLD_TONES[Math.floor(Math.random() * GOLD_TONES.length)];

            star.style.background = color;
            if (isHero) {
                star.style.boxShadow = `0 0 ${size * 2}px rgba(245, 239, 227, 0.5)`;
            }

            star.style.cssText += `
                width:${size}px; height:${size}px;
                top:${top}%; left:${left}%;
                --duration:${rand(2, 6)}s;
                --delay:${rand(0, 6)}s;
                --opacity:${opacity};
            `;
            starsContainer.appendChild(star);
        }

        // ---------- Parallax depth on mouse move ----------
        const moonLayer = document.getElementById('moonLayer');
        const chamber = document.getElementById('chamber');
        const botanicalCorner = document.getElementById('botanicalCorner');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;

            window.addEventListener('mousemove', (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                targetY = (e.clientY / window.innerHeight - 0.5) * 2;
            });

            function animateParallax() {
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;

                canvas.style.transform = `translate(${currentX * 4}px, ${currentY * 4}px)`;
                document.getElementById('stars').style.transform = `translate(${currentX * 4}px, ${currentY * 4}px)`;
                moonLayer.style.transform = `translate(${currentX * 14}px, ${currentY * 14}px)`;
                chamber.style.transform = `translate(${currentX * -3}px, ${currentY * -3}px)`;
                botanicalCorner.style.transform = `translate(${currentX * 10}px, ${currentY * 10}px)`;

                requestAnimationFrame(animateParallax);
            }

            requestAnimationFrame(animateParallax);
        }

        // ---------- Loading / entrance sequence ----------
        const loader = document.getElementById('loader');
        const MIN_LOADER_TIME = 800; // ms — feels intentional, not just a flicker
        const startTime = performance.now();

        window.addEventListener('load', () => {
            const elapsed = performance.now() - startTime;
            const remaining = Math.max(0, MIN_LOADER_TIME - elapsed);
            setTimeout(() => {
                loader.classList.add('hide');
                document.body.classList.add('loaded');
            }, remaining);
        });
    </script>
</body>
</html>
