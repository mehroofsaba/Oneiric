<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Edit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 60px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        h1 { color: #c9a96e; font-size: 1.8rem; letter-spacing: 0.15rem; }

        a.back {
            color: #9e9589;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back:hover { color: #c9a96e; }

        .editor {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2e2e2e;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
        }

        input[type="text"]:focus { border-bottom-color: #c9a96e; }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px 0;
            background: transparent;
            border: none;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.8;
            outline: none;
            resize: none;
        }

        button {
            align-self: flex-end;
            padding: 12px 32px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.05rem;
        }

        button:hover { background-color: #b8935a; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌙 Edit</h1>
                <div style="display:flex; gap:16px;">
                        <a href="/chamber" style="padding:8px 20px; background-color:#1a1a1a; color:#9e9589; border-radius:20px; text-decoration:none; font-family:'Georgia',serif; font-size:0.85rem; letter-spacing:0.05rem;">🌙 chamber</a>
                        <a href="/entries" style="padding:8px 20px; background-color:#c9a96e; color:#0d0d0d; border-radius:20px; text-decoration:none; font-family:'Georgia',serif; font-size:0.85rem; letter-spacing:0.05rem;">^_~ Entries</a>
        </div>
    </div>
    <p style="text-align:center; color:#555; font-size:0.8rem; margin-bottom:8px;">
        last edited: <span th:text="${#temporals.format(entry.updatedAt, 'dd MMM yyyy, HH:mm')}"></span>
    </p>
    <form class="editor" th:action="@{/entries/{id}/edit(id=${entry.id})}" method="post">
        <input type="text" name="title" th:value="${entry.title}" required />
        <textarea name="content" th:text="${entry.content}"></textarea>
        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
