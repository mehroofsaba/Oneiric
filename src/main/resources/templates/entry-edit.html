<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <script>
        (function() {
            const t = localStorage.getItem('oneiric-theme');
            if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>Oneiric — Edit</title>
    <style>
    .border-deco {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.border-moon {
    position: fixed;
    font-size: 2.2rem;
    opacity: 0.12;
    color: var(--accent);
    pointer-events: none;
    z-index: 0;
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
}

.border-star {
    position: fixed;
    color: var(--accent);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    animation: twinkle 4s ease-in-out infinite;
}
    
        :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #555;
            --accent: #c9a96e;
            --accent-hover: #b8935a;
            --accent-dim: rgba(201,169,110,0.08);
            --border: #2e2e2e;
            --border-accent: rgba(201,169,110,0.2);
            --cloud-r: 180; --cloud-g: 140; --cloud-b: 80;
            --danger: #c97070;
            --danger-hover: #d98a8a;
        }

   [data-theme="sakura"] {
            --bg: #fdf6f0;
            --bg-secondary: #fff0f3;
            --bg-tertiary: #ffe4ec;
            --text: #4a3040;
            --text-muted: #9e7080;
            --text-subtle: #c4a0b0;
            --accent: #e8829a;
            --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --border: #f0c0d0;
            --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
            --star-color: #e8829a;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #7090b8;
            --text-subtle: #3a5070;
            --accent: #c9a96e;
            --accent-hover: #b8935a;
            --accent-dim: rgba(201,169,110,0.12);
            --border: #1a2e48;
            --border-accent: rgba(201,169,110,0.25);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180;
            --star-color: #c9a96e;
        }

          [data-theme="sage"] {
            --bg: #fbeae6;
            --bg-secondary: #f6dfd7;
            --bg-tertiary: #e8c2ba;
            --text: #3d2f3a;
            --text-muted: #8a6b7d;
            --text-subtle: #c9a8b8;
            --accent: #7c5c74;
            --accent-hover: #5c4055;
            --accent-dim: rgba(124,92,116,0.14);
            --border: #e0c0c8;
            --border-accent: rgba(124,92,116,0.35);
            --cloud-r: 226; --cloud-g: 122; --cloud-b: 122;
            --star-color: #7c5c74;
        } 

        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --text-subtle: #444444;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --border: #222222;
            --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
            --star-color: #ffffff;
        }
   

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 60px 40px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Corner decorations */
        .corner {
            position: fixed;
            color: var(--accent);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            line-height: 1;
        }

        .corner-tl { top: 16px; left: 16px; }
        .corner-tr { top: 16px; right: 16px; transform: scaleX(-1); }
        .corner-bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
        .corner-br { bottom: 16px; right: 16px; transform: scale(-1); }

        .border-top, .border-bottom {
            position: fixed;
            left: 48px; right: 48px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-accent), transparent);
            pointer-events: none; z-index: 0;
        }

        .border-top { top: 48px; }
        .border-bottom { bottom: 48px; }

        .border-left, .border-right {
            position: fixed;
            top: 48px; bottom: 48px;
            width: 1px;
            background: linear-gradient(180deg, transparent, var(--border-accent), transparent);
            pointer-events: none; z-index: 0;
        }

        .border-left { left: 48px; }
        .border-right { right: 48px; }

        .deco-star {
            position: fixed;
            color: var(--accent);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
            font-size: var(--sz);
            animation: twinkle var(--dur) ease-in-out infinite var(--del);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.35; }
        }

        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            row-gap: 14px;
        }

        h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 0.15rem; }

        .editor {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .last-edited {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto 18px;
            text-align: left;
            color: var(--text-subtle);
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .last-edited svg { width: 0.9em; height: 0.9em; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }

        .field-group { display: flex; flex-direction: column; gap: 8px; }

        .field-label {
            font-size: 0.72rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            color: var(--text-subtle);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 0 14px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-bottom-color: var(--accent); }

        /* Mood selector — matches Write page chips */
        .mood-group { display: flex; flex-direction: column; gap: 10px; }

        .mood-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .mood-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .mood-chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-muted);
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mood-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .mood-chip.selected {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Toolbar — matches Write page */
        .editor-frame {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .editor-frame:focus-within { border-color: var(--accent); }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .toolbar button {
            all: unset;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .toolbar button:hover { color: var(--accent); background: var(--accent-dim); }
        .toolbar button svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .toolbar .divider { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }
        .toolbar .spacer { flex: 1; }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 20px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.8;
            outline: none;
            resize: vertical;
        }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            font-size: 0.78rem;
            color: var(--text-subtle);
        }

        .editor-footer .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .editor-footer .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.7;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .left-actions, .right-actions {
            display: flex;
            gap: 10px;
        }

        button.primary {
            padding: 9px 22px;
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.88rem;
            cursor: pointer;
            letter-spacing: 0.03rem;
            transition: background-color 0.2s;
        }

        button.primary:hover { background-color: var(--accent-hover); }

        a.discard, button.delete-entry {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        a.discard:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        button.delete-entry {
            color: var(--danger);
            border-color: transparent;
            padding: 9px 14px;
        }

        button.delete-entry:hover {
            background: rgba(201,112,112,0.08);
            border-color: var(--danger);
        }

        a.discard svg, button.delete-entry svg { width: 0.95em; height: 0.95em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .nav-links { display: flex; gap: 16px; }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            min-width: 140px;
        }

        .nav-links a.chamber-link {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .nav-links a.chamber-link:hover {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-dim);
        }

        .nav-links a.btn {
            background-color: var(--accent);
            color: var(--bg);
        }

        .nav-links a.btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 0 12px var(--accent-dim);
        }

        /* Delete confirmation modal — matches Entries page */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px var(--accent-dim);
        }

        .modal-box .modal-icon {
            width: 1.8rem;
            height: 1.8rem;
            margin: 0 auto 14px;
            opacity: 0.85;
        }

        .modal-box .modal-icon svg { width: 100%; height: 100%; fill: none; stroke: var(--danger); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .modal-box h3 { color: var(--accent); font-size: 1.2rem; margin-bottom: 12px; }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .modal-btn.cancel:hover { color: var(--accent); border: 1px solid var(--accent); }

        .modal-btn.confirm {
            background-color: var(--danger);
            color: #fff5f0;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .modal-btn.confirm:hover { background-color: var(--danger-hover); }

        /* ── Mobile fixes: header wrapping + tighter spacing ── */
        @media (max-width: 640px) {
            body { padding: 32px 20px; }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                margin-bottom: 28px;
            }

            .nav-links {
                width: 100%;
                gap: 10px;
            }

            .nav-links a {
                flex: 1 1 0;
                min-width: 0;
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .border-top, .border-bottom { left: 20px; right: 20px; }
            .border-left, .border-right { top: 20px; bottom: 20px; }
            .border-top { top: 20px; }
            .border-bottom { bottom: 20px; }
            .border-left { left: 20px; }
            .border-right { right: 20px; }

            .form-actions { flex-direction: column-reverse; align-items: stretch; }
            .left-actions, .right-actions { width: 100%; }
            .right-actions { flex-direction: column-reverse; }
            .left-actions button.delete-entry { width: 100%; justify-content: center; }
            .right-actions a.discard, .right-actions button.primary { width: 100%; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Celestial background -->
    <canvas id="bg" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></canvas>

    <!-- Floating stars -->
    <div id="floatStars" style="position:fixed; inset:0; z-index:0; pointer-events:none;"></div>

    <!-- Swirl decorations -->
       <svg style="position:fixed; bottom:0; left:0; width:220px; height:220px; z-index:0; pointer-events:none; opacity:0.1;" viewBox="0 0 220 220">
        <!-- Swirl -->
        <path d="M20 180 C40 140, 80 160, 60 120 C40 80, 80 60, 100 80 C120 100, 100 130, 130 110 C160 90, 170 50, 150 30" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
        <path d="M10 160 C30 130, 50 145, 40 110 C30 75, 60 55, 80 70" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.6"/>
        <!-- Book -->
        <rect x="60" y="170" width="80" height="50" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <line x1="100" y1="170" x2="100" y2="220" stroke="var(--accent)" stroke-width="1"/>
        <line x1="70" y1="178" x2="95" y2="178" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <line x1="70" y1="185" x2="95" y2="185" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <line x1="70" y1="192" x2="95" y2="192" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <line x1="105" y1="178" x2="130" y2="178" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <line x1="105" y1="185" x2="130" y2="185" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <line x1="105" y1="192" x2="130" y2="192" stroke="var(--accent)" stroke-width="0.8" opacity="0.7"/>
        <!-- Pen -->
        <line x1="135" y1="215" x2="155" y2="195" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
        <polygon points="155,195 160,190 158,198" fill="var(--accent)" opacity="0.8"/>
    </svg>
        <svg style="position:fixed; top:0; right:0; width:220px; height:220px; z-index:0; pointer-events:none; opacity:0.1; transform:rotate(180deg);" viewBox="0 0 220 220">
        <path d="M20 180 C40 140, 80 160, 60 120 C40 80, 80 60, 100 80 C120 100, 100 130, 130 110 C160 90, 170 50, 150 30" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
        <path d="M10 160 C30 130, 50 145, 40 110 C30 75, 60 55, 80 70" stroke="var(--accent)" stroke-width="1" fill="none" opacity="0.6"/>
        <!-- Stars bottom left (appears top right due to rotation) -->
        <text x="30" y="50" font-size="18" fill="var(--accent)" opacity="0.9">✦</text>
        <text x="55" y="30" font-size="12" fill="var(--accent)" opacity="0.7">✧</text>
        <text x="15" y="75" font-size="10" fill="var(--accent)" opacity="0.6">★</text>
        <text x="70" y="55" font-size="8" fill="var(--accent)" opacity="0.5">✦</text>
    </svg>

    <!-- Crescent moon top left -->
    <svg style="position:fixed; top:20px; left:20px; width:120px; height:120px; z-index:0; pointer-events:none; opacity:0.1;" viewBox="0 0 120 120">
        <path d="M60 20 A35 35 0 1 0 60 90 A25 25 0 1 1 60 20Z" fill="var(--accent)"/>
        <!-- Stars around moon -->
        <text x="85" y="30" font-size="14" fill="var(--accent)">✦</text>
        <text x="95" y="55" font-size="9" fill="var(--accent)" opacity="0.8">✧</text>
        <text x="78" y="75" font-size="11" fill="var(--accent)" opacity="0.7">★</text>
        <text x="20" y="25" font-size="10" fill="var(--accent)" opacity="0.6">✧</text>
        <text x="10" y="50" font-size="8" fill="var(--accent)" opacity="0.5">✦</text>
    </svg>

    <!-- Extra stars bottom left -->
    <svg style="position:fixed; bottom:20px; left:20px; width:100px; height:100px; z-index:0; pointer-events:none; opacity:0.12;" viewBox="0 0 100 100">
        <text x="10" y="40" font-size="20" fill="var(--accent)">✦</text>
        <text x="40" y="25" font-size="14" fill="var(--accent)" opacity="0.8">✧</text>
        <text x="60" y="50" font-size="10" fill="var(--accent)" opacity="0.6">★</text>
        <text x="25" y="65" font-size="12" fill="var(--accent)" opacity="0.7">✦</text>
        <text x="5" y="75" font-size="8" fill="var(--accent)" opacity="0.5">✧</text>
    </svg>

    <!-- Extra stars top right -->
    <svg style="position:fixed; top:20px; right:20px; width:100px; height:100px; z-index:0; pointer-events:none; opacity:0.12;" viewBox="0 0 100 100">
        <text x="60" y="40" font-size="20" fill="var(--accent)">✦</text>
        <text x="30" y="25" font-size="14" fill="var(--accent)" opacity="0.8">✧</text>
        <text x="10" y="50" font-size="10" fill="var(--accent)" opacity="0.6">★</text>
        <text x="50" y="65" font-size="12" fill="var(--accent)" opacity="0.7">✦</text>
        <text x="80" y="75" font-size="8" fill="var(--accent)" opacity="0.5">✧</text>
    </svg>

    <!-- Frame decoration -->
    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <div class="corner corner-tl">✦ · · ·<br>·<br>·</div>
    <div class="corner corner-tr">✦ · · ·<br>·<br>·</div>
    <div class="corner corner-bl">·<br>·<br>✦ · · ·</div>
    <div class="corner corner-br">·<br>·<br>✦ · · ·</div>

    <div class="deco-star" style="top:60px; left:80px; --sz:0.7rem; --dur:3s; --del:0s;">✧</div>
    <div class="deco-star" style="top:60px; right:80px; --sz:0.6rem; --dur:4s; --del:1s;">✦</div>
    <div class="deco-star" style="bottom:60px; left:80px; --sz:0.6rem; --dur:3.5s; --del:0.5s;">✧</div>
    <div class="deco-star" style="bottom:60px; right:80px; --sz:0.7rem; --dur:4s; --del:2s;">✦</div>

    <div class="header">
        <h1>
            <svg viewBox="0 0 24 24" width="0.85em" height="0.85em" fill="var(--accent)" style="vertical-align:middle; margin-right:8px;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>Edit
        </h1>
        <div class="nav-links">
            <a href="/chamber" class="chamber-link">
                <svg viewBox="0 0 24 24" width="1em" height="1em" fill="var(--accent)" style="vertical-align:middle; margin-right:4px;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg> Chamber
            </a>
            <a href="/entries" class="btn">✦ Entries</a>
        </div>
    </div>

    <p class="last-edited">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Last edited: <span th:text="${#temporals.format(entry.updatedAt, 'dd MMM yyyy, HH:mm')}"></span>
    </p>

    <form class="editor" id="editForm" th:action="@{/entries/{id}/edit(id=${entry.id})}" method="post">

        <div class="field-group">
            <p class="field-label">Title</p>
            <input type="text" name="title" id="titleInput" th:value="${entry.title}" required />
        </div>

        <!-- Mood selector -->
        <div class="mood-group">
            <p class="mood-label">Mood:</p>
            <div class="mood-options" id="moodOptions">
                <button type="button" class="mood-chip" data-mood="happy">(❁´◡`❁) Happy</button>
                <button type="button" class="mood-chip" data-mood="calm">^_^ Calm</button>
                <button type="button" class="mood-chip" data-mood="sad">＞︿＜ Sad</button>
                <button type="button" class="mood-chip" data-mood="anxious">＞﹏＜ Anxious</button>
                <button type="button" class="mood-chip" data-mood="angry">(╬▔皿▔)╯ Angry</button>
                <button type="button" class="mood-chip" data-mood="lonely">( ﾉ ﾟｰﾟ)ﾉ Lonely</button>
                <button type="button" class="mood-chip" data-mood="excited">(≧∀≦)ゞ Excited</button>
                <button type="button" class="mood-chip" data-mood="confused">*-* Confused</button>
                <button type="button" class="mood-chip" data-mood="neutral">^_____^ Neutral</button>
                <button type="button" class="mood-chip" data-mood="bored">–_– Bored</button>
            </div>
            <input type="hidden" name="mood" id="moodInput" th:value="${entry.mood}"/>
        </div>

        <!-- Formatting toolbar + textarea -->
        <div class="editor-frame">
            <div class="toolbar">
                <button type="button" title="Bold" onclick="wrapSelection('**','**')"><strong>B</strong></button>
                <button type="button" title="Italic" onclick="wrapSelection('_','_')"><em>I</em></button>
                <button type="button" title="Quote" onclick="wrapSelection('&laquo; ','')">&laquo;</button>
                <button type="button" title="List" onclick="wrapSelection('- ','')">
                    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
                </button>
                <button type="button" title="Divider" onclick="wrapSelection('\n---\n','')">—</button>
                <div class="spacer"></div>
                <button type="button" title="Insert image">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </button>
            </div>
            <textarea name="content" id="contentInput" th:text="${entry.content}"></textarea>
            <div class="editor-footer">
                <span class="status"><span class="dot"></span> <span id="statusText">Editing</span></span>
                <span id="charCount">0 / 10,000</span>
            </div>
        </div>

        <div class="form-actions">
            <div class="left-actions">
                <button type="button" class="delete-entry" onclick="openDeleteModal()">
                    <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                    Delete entry
                </button>
            </div>
            <div class="right-actions">
                <a href="/entries" class="discard">
                    <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
                    Discard
                </a>
                <button type="submit" class="primary">Save Changes</button>
            </div>
        </div>
    </form>

    <!-- Delete confirmation modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </div>
            <h3>Let this thought go?</h3>
            <p>This entry will be deleted permanently and cannot be recovered.</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">Keep it</button>
                <button class="modal-btn confirm" onclick="submitDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Hidden delete form -->
    <form id="deleteForm" th:action="@{/entries/{id}/delete(id=${entry.id})}" method="post" style="display:none;"></form>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawBg();
        }

        function getCSSVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function drawBg() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const r = getCSSVar('--cloud-r') || '180';
            const g = getCSSVar('--cloud-g') || '140';
            const b = getCSSVar('--cloud-b') || '80';

            function drawCloud(x, y, size) {
                [[0,0,size],[size*.6,-size*.2,size*.75],[-size*.5,-size*.1,size*.7],
                 [size*.2,-size*.5,size*.6],[-size*.2,-size*.55,size*.55]
                ].forEach(([cx,cy,r2]) => {
                    const grad = ctx.createRadialGradient(x+cx,y+cy,0,x+cx,y+cy,r2);
                    grad.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
                    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x+cx,y+cy,r2,0,Math.PI*2);
                    ctx.fill();
                });
            }

            // Corners only
            drawCloud(0, 0, 140);
            drawCloud(w, 0, 140);
            drawCloud(0, h, 140);
            drawCloud(w, h, 140);

            // Sparkles
            const accent = getCSSVar('--accent') || '#c9a96e';
            function drawSparkle(x, y, size, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = accent;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y-size); ctx.lineTo(x, y+size);
                ctx.moveTo(x-size, y); ctx.lineTo(x+size, y);
                ctx.moveTo(x-size*.6, y-size*.6); ctx.lineTo(x+size*.6, y+size*.6);
                ctx.moveTo(x+size*.6, y-size*.6); ctx.lineTo(x-size*.6, y+size*.6);
                ctx.stroke();
                ctx.restore();
            }

            [[w*.08,h*.08,4],[w*.92,h*.08,4],[w*.08,h*.92,4],[w*.92,h*.92,4],
             [w*.15,h*.2,3],[w*.85,h*.18,3],[w*.12,h*.75,3],[w*.88,h*.8,3]
            ].forEach(([x,y,s]) => drawSparkle(x, y, s, 0.5));
        }

        // Floating twinkling stars
        const floatContainer = document.getElementById('floatStars');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            const size = Math.random() * 2 + 1;
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c9a96e';
            star.style.cssText = `
                position:absolute;
                width:${size}px; height:${size}px;
                border-radius:50%;
                background:${accent};
                top:${Math.random()*100}%; left:${Math.random()*100}%;
                opacity:0;
                animation: twinkleEdit ${Math.random()*4+2}s ease-in-out infinite ${Math.random()*5}s;
            `;
            floatContainer.appendChild(star);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes twinkleEdit {
                0%, 100% { opacity: 0; transform: scale(0.8); }
                50% { opacity: 0.4; transform: scale(1.2); }
            }
        `;
        document.head.appendChild(style);

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Also add --cloud-r/g/b to themes that are missing it
        const themeCloudColors = {
            'default': '180,140,80',
            'sakura': '232,130,154',
            'abyss': '60,100,180',
            'sage': '122,158,110',
            'noir': '200,200,200'
        };
    </script>

    <script>
        // ── Mood selector wiring ──
        const moodInput = document.getElementById('moodInput');
        const moodButtons = document.querySelectorAll('.mood-chip');

        function setMood(mood) {
            moodInput.value = mood;
            moodButtons.forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.mood === mood);
            });
        }

        moodButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (moodInput.value === btn.dataset.mood) {
                    setMood(''); // toggle off
                } else {
                    setMood(btn.dataset.mood);
                }
            });
        });

        // Pre-select mood from server-rendered value
        if (moodInput.value) setMood(moodInput.value);

        // ── Character counter ──
        const contentInput = document.getElementById('contentInput');
        const charCount = document.getElementById('charCount');
        const statusText = document.getElementById('statusText');
        const MAX_CHARS = 10000;

        function updateCharCount() {
            const len = contentInput.value.length;
            charCount.textContent = `${len} / ${MAX_CHARS}`;
        }
        updateCharCount();

        let dirty = false;
        function markDirty() {
            if (!dirty) {
                dirty = true;
                statusText.textContent = 'Unsaved changes';
            }
            updateCharCount();
        }

        contentInput.addEventListener('input', markDirty);
        document.getElementById('titleInput').addEventListener('input', markDirty);

        document.getElementById('editForm').addEventListener('submit', () => {
            dirty = false;
        });

        // ── Basic formatting helpers ──
        function wrapSelection(before, after) {
            const start = contentInput.selectionStart;
            const end = contentInput.selectionEnd;
            const val = contentInput.value;
            const selected = val.substring(start, end);
            const newVal = val.substring(0, start) + before + selected + after + val.substring(end);
            contentInput.value = newVal;
            contentInput.focus();
            contentInput.selectionStart = start + before.length;
            contentInput.selectionEnd = start + before.length + selected.length;
            markDirty();
        }

        // ── Delete modal ──
        function openDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }
        function submitDelete() {
            document.getElementById('deleteForm').submit();
        }
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });
    </script>

</body>
</html>
