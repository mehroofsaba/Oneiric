<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script>
    // Apply saved theme immediately to prevent flash
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
</script>
    <title>Oneiric — Edit</title>
    <style>
    
            :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #555;
            --accent: #c9a96e;
            --accent-hover: #b8935a;
            --accent-dim: rgba(201,169,110,0.08);
            --border: #2e2e2e;
            --border-accent: rgba(201,169,110,0.2);
            --cloud-r: 180; --cloud-g: 140; --cloud-b: 80;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0;
            --bg-secondary: #fff0f3;
            --bg-tertiary: #ffe4ec;
            --text: #4a3040;
            --text-muted: #9e7080;
            --text-subtle: #c4a0b0;
            --accent: #e8829a;
            --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --border: #f0c0d0;
            --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #7090b8;
            --text-subtle: #3a5070;
            --accent: #7eb8e8;
            --accent-hover: #5a9fd4;
            --accent-dim: rgba(126,184,232,0.08);
            --border: #1a2e48;
            --border-accent: rgba(126,184,232,0.2);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180;
        }

        [data-theme="sage"] {
            --bg: #f4f6f0;
            --bg-secondary: #eaefe4;
            --bg-tertiary: #dde5d4;
            --text: #2d3828;
            --text-muted: #6e8060;
            --text-subtle: #a0b090;
            --accent: #7a9e6e;
            --accent-hover: #5e8050;
            --accent-dim: rgba(122,158,110,0.08);
            --border: #c8d8b8;
            --border-accent: rgba(122,158,110,0.3);
            --cloud-r: 122; --cloud-g: 158; --cloud-b: 110;
        }

        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --text-subtle: #444444;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --border: #222222;
            --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
        }
    
        * { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: #0d0d0d;
    color: #e8e0d0;
    font-family: 'Georgia', serif;
    min-height: 100vh;
    padding: 60px 40px;
    position: relative;
    overflow-x: hidden;
}

/*Layered starfield + glow, sits behind all content */
.sky-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background-color: #0d0d0d;
    background-image:
        radial-gradient(circle at 8% 10%, rgba(201, 169, 110, 0.16) 0%, transparent 32%),
        radial-gradient(circle at 92% 90%, rgba(201, 169, 110, 0.16) 0%, transparent 32%),
        radial-gradient(1.5px 1.5px at 10% 15%, #c9a96e 50%, transparent 100%),
        radial-gradient(1px 1px at 20% 8%, #9e9589 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 5% 30%, #e8e0d0 50%, transparent 100%),
        radial-gradient(1px 1px at 15% 45%, #c9a96e 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 60%, #9e9589 50%, transparent 100%),
        radial-gradient(1px 1px at 45% 12%, #e8e0d0 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 75%, #c9a96e 50%, transparent 100%),
        radial-gradient(1px 1px at 55% 30%, #9e9589 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 20%, #e8e0d0 50%, transparent 100%),
        radial-gradient(1px 1px at 95% 35%, #c9a96e 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 80%, #9e9589 50%, transparent 100%),
        radial-gradient(1px 1px at 80% 92%, #e8e0d0 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 96% 65%, #c9a96e 50%, transparent 100%),
        radial-gradient(1px 1px at 70% 50%, #e8e0d0 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 85%, #c9a96e 50%, transparent 100%);
    background-repeat: no-repeat;
    background-size: cover;
    animation: twinkle 6s ease-in-out infinite alternate, glow-shift 12s ease-in-out infinite alternate;
}

@keyframes twinkle {
    0%   { opacity: 0.6; }
    50%  { opacity: 1; }
    100% { opacity: 0.7; }
}

@keyframes glow-shift {
    0%   { filter: brightness(1); }
    100% { filter: brightness(1.15); }
}

/* Drifting clouds — soft blurred ellipses moving slowly across */
.cloud {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(158, 149, 137, 0.10) 0%, transparent 70%);
    filter: blur(8px);
    pointer-events: none;
}

.cloud-1 {
    width: 400px; height: 160px;
    top: 12%;
    left: -450px;
    animation: drift-right 40s linear infinite;
}

.cloud-2 {
    width: 300px; height: 120px;
    bottom: 18%;
    right: -350px;
    animation: drift-left 55s linear infinite;
}

.cloud-3 {
    width: 250px; height: 100px;
    top: 55%;
    left: -300px;
    animation: drift-right 65s linear infinite;
    animation-delay: -20s;
}

@keyframes drift-right {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 500px)); }
}

@keyframes drift-left {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-100vw - 500px)); }
}

/* Corner moons, gently bobbing */
.corner-moon {
    position: fixed;
    font-size: 2.5rem;
    opacity: 0.3;
    pointer-events: none;
    filter: sepia(1) saturate(2) hue-rotate(-10deg);
    animation: bob 5s ease-in-out infinite;
}

.corner-moon.top-left {
    top: 40px;
    left: 40px;
}

.corner-moon.bottom-right {
    bottom: 40px;
    right: 40px;
    transform: scaleX(-1);
    animation-delay: -2.5s;
}

@keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
}

.corner-moon.bottom-right {
    animation-name: bob-flip;
}

@keyframes bob-flip {
    0%, 100% { transform: scaleX(-1) translateY(0); }
    50%      { transform: scaleX(-1) translateY(-10px); }
}


        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        h1 { color: #c9a96e; font-size: 1.8rem; letter-spacing: 0.15rem; }

        a.back {
            color: #9e9589;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back:hover { color: #c9a96e; }

        .editor {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2e2e2e;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
        }

        input[type="text"]:focus { border-bottom-color: #c9a96e; }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px 0;
            background: transparent;
            border: none;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.8;
            outline: none;
            resize: none;
        }

        button {
            align-self: flex-end;
            padding: 12px 32px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.05rem;
        }

        button:hover { background-color: #b8935a; }
        
        .nav-links {
    display: flex;
    gap: 16px;
}

.nav-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    border-radius: 20px;
    text-decoration: none;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    min-width: 140px;
    box-sizing: border-box;
    text-align: center;
    letter-spacing: 0.05rem;
}

.nav-links a.chamber-link {
    background-color: #1a1a1a;
    color: #8a8175;
    font-size: 0.95rem;
}

.nav-links a.chamber-link:hover {
    color: #c9a96e;
    border-color: #c9a96e;
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.25);
}

.nav-links a.btn {
    background-color: #c9a96e;
    color: #0d0d0d;
}

.nav-links a.btn:hover {
    background-color: #b8935a;
    border-color: #c9a96e;
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.35);
}
        
    </style>
</head>
<body>
<div class="sky-layer"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<div class="corner-moon top-left">🌙</div>
<div class="corner-moon bottom-right">🌙</div>

  <div class="header">
    <h1>🌙 Edit</h1>
    <div class="nav-links">
        <a href="/chamber" class="chamber-link">🌙 Chamber</a>
        <a href="/entries" class="btn">💖 Entries</a>
    </div>
</div>
    <p style="text-align:center; color:#555; font-size:0.8rem; margin-bottom:8px;">
        Last edited: <span th:text="${#temporals.format(entry.updatedAt, 'dd MMM yyyy, HH:mm')}"></span>
    </p>
    <form class="editor" th:action="@{/entries/{id}/edit(id=${entry.id})}" method="post">
        <input type="text" name="title" th:value="${entry.title}" required />
        <textarea name="content" th:text="${entry.content}"></textarea>
        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
