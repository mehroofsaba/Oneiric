<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <title>Oneiric — Edit</title>
    <style>

        :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #6e6858;
            --accent: #d4b478;
            --accent-hover: #c29a5c;
            --accent-dim: rgba(212,180,120,0.12);
            --accent-glow: rgba(212,180,120,0.22);
            --border: #2e2e2e;
            --border-accent: rgba(212,180,120,0.28);
            --cloud-r: 200; --cloud-g: 160; --cloud-b: 90;
            --danger: #c97070;
            --danger-hover: #d98a8a;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0; --bg-secondary: #fff0f3; --bg-tertiary: #ffe4ec;
            --text: #4a3040; --text-muted: #9e7080; --text-subtle: #c4a0b0;
            --accent: #e8829a; --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --accent-glow: rgba(232,130,154,0.18);
            --border: #f0c0d0; --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
            --star-color: #e8829a;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #8098c0;
            --text-subtle: #4a6088;
            --accent: #d4b56a;
            --accent-hover: #c9a253;
            --accent-dim: rgba(212,181,106,0.12);
            --accent-glow: rgba(212,181,106,0.22);
            --border: #1a2e48;
            --border-accent: rgba(212,181,106,0.25);
            --cloud-r: 212; --cloud-g: 181; --cloud-b: 106;
            --star-color: #d4b56a;
        }

        [data-theme="sage"] {
            --bg: #F5E3DF;
            --bg-secondary: #F0D9D4;
            --bg-tertiary: #E3BEB8;
            --text: #4A3040;
            --text-muted: #806477;
            --text-subtle: #B99BAA;
            --accent: #B8955A;
            --accent-hover: #A27F4B;
            --accent-dim: rgba(184,149,90,0.12);
            --accent-glow: rgba(184,149,90,0.22);
            --border: #D9B9BD;
            --border-accent: rgba(184,149,90,0.28);
            --cloud-r: 210; --cloud-g: 120; --cloud-b: 120;
            --star-color: #B8955A;
        }

        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #b8b8b8;
            --text-subtle: #666666;
            --accent: #f2f2f2;
            --accent-hover: #d6d6d6;
            --accent-dim: rgba(210,210,210,0.07);
            --accent-glow: rgba(210,210,210,0.18);
            --border: #242424;
            --border-accent: rgba(210,210,210,0.22);
            --cloud-r: 190; --cloud-g: 190; --cloud-b: 195;
            --star-color: #d8d8dc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 40px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            animation: pageFadeIn 0.6s ease-out;
        }

        @keyframes pageFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ── Corner decorations ── */
        .corner-deco {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0.28;
            color: var(--accent);
            animation: gentleDrift 6s ease-in-out infinite;
        }

        .corner-deco svg { display: block; overflow: visible; }
        .corner-tl { top: 20px; left: 20px; width: 110px; }
        .corner-tr { top: 20px; right: 20px; width: 160px; }
        .corner-bl { bottom: 20px; left: 20px; width: 160px; }
        .corner-br { bottom: 20px; right: 20px; width: 120px; }

        .vine { stroke: var(--accent); stroke-width: 1.3; fill: none; stroke-linecap: round; }
        .bud  { fill: var(--accent); opacity: 0.75; }
        .book-deco { stroke: var(--accent); stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes gentleDrift {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .deco-star {
            position: fixed;
            color: var(--accent);
            pointer-events: none;
            z-index: 0;
            font-size: var(--sz);
            opacity: var(--base-op, 0.22);
            animation: twinkle var(--dur) ease-in-out infinite var(--del);
        }

        @keyframes twinkle {
            0%, 100% { opacity: calc(var(--base-op, 0.22) * 0.4); transform: scale(0.85); }
            50% { opacity: calc(var(--base-op, 0.22) * 1.6); transform: scale(1.15); }
        }

        .border-top, .border-bottom {
            position: fixed; left: 48px; right: 48px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-accent), var(--accent-hover), var(--border-accent), transparent);
            opacity: 0.6; pointer-events: none; z-index: 0;
        }
        .border-top { top: 48px; }
        .border-bottom { bottom: 48px; }

        .border-left, .border-right {
            position: fixed; top: 48px; bottom: 48px; width: 1px;
            background: linear-gradient(180deg, transparent, var(--border-accent), var(--accent-hover), var(--border-accent), transparent);
            opacity: 0.6; pointer-events: none; z-index: 0;
        }
        .border-left { left: 48px; }
        .border-right { right: 48px; }

        /* ── Header ── */
        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            row-gap: 12px;
        }

        h1 {
            color: var(--accent);
            font-size: 1.7rem;
            letter-spacing: 0.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            text-shadow: 0 0 18px var(--accent-glow);
        }

        h1 svg { width: 0.9em; height: 0.9em; fill: var(--accent); }

        .nav-links { display: flex; gap: 8px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links:hover { opacity: 1; }

        .nav-links a {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            padding: 6px 16px; border-radius: 16px; text-decoration: none;
            font-family: 'Georgia', serif; font-size: 0.76rem;
            border: 1px solid transparent; transition: all 0.2s ease;
            min-width: 92px; box-sizing: border-box; text-align: center;
        }

        .nav-links a.chamber-link {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border-color: var(--border);
        }
        .nav-links a.chamber-link:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .nav-links a.btn {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border-color: var(--border);
        }
        .nav-links a.btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        /* ── Meta row ── */
        .meta-row {
            position: relative; z-index: 1;
            max-width: 700px; margin: 0 auto 20px;
            display: flex; justify-content: flex-start;
            align-items: center; flex-wrap: wrap; gap: 8px;
        }

        .last-edited {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-subtle);
            font-size: 0.78rem;
            letter-spacing: 0.03rem;
        }
        .last-edited svg { width: 0.9em; height: 0.9em; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }

        /* ── Editor ── */
        .editor {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-group { display: flex; flex-direction: column; gap: 4px; }

        .field-label {
            font-size: 0.72rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            color: var(--text-subtle);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
            transition: border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
            caret-color: var(--accent);
        }

        input[type="text"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus {
            border-bottom-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 2px 0 -1px var(--accent-glow), 0 6px 18px -8px var(--accent-glow);
        }

           /* ── Mood ── */
.mood-group-label {
    color: var(--text-muted);
    font-size: 0.85rem;
    letter-spacing: 0.03rem;
}

.mood-scroll-wrap {
    position: relative;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.mood-scroll-wrap::-webkit-scrollbar {
    display: none;
}

.mood-scroll-wrap::after {
    content: '';
    display: none;
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 40px;
    background: linear-gradient(to right, transparent, var(--bg));
    pointer-events: none;
    border-radius: 0 16px 16px 0;
}

@media (max-width: 640px) {
    .mood-scroll-wrap::after { display: block; }
    .mood-row {
        display: flex !important;
        flex-wrap: nowrap !important;
        width: max-content;
        padding-bottom: 4px;
        gap: 6px;
    }
    .mood-label { flex-shrink: 0; }
}

.mood-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
    gap: 6px;
    padding: 2px 0 4px;
    width: 100%;
}

.mood-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 5px 10px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-family: 'Georgia', serif;
    font-size: 0.74rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    color: var(--text-muted);
}

.mood-label:hover { border-color: var(--accent); }
.mood-label input[type="radio"] { display: none; }

.mood-label:has(input:checked) {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--accent-dim), var(--accent-glow));
    box-shadow: 0 0 0 2px var(--accent-dim), 0 0 18px var(--accent-glow);
}

.mood-label:has(input:checked) .face,
.mood-label:has(input:checked) .mood-text { color: var(--accent) !important; }

.mood-label.happy .face,    .mood-label.happy .mood-text    { color: #c47a20; }
.mood-label.calm .face,     .mood-label.calm .mood-text     { color: #3a9e88; }
.mood-label.sad .face,      .mood-label.sad .mood-text      { color: #4a88c8; }
.mood-label.anxious .face,  .mood-label.anxious .mood-text  { color: #9060c0; }
.mood-label.angry .face,    .mood-label.angry .mood-text    { color: #c84040; }
.mood-label.lonely .face,   .mood-label.lonely .mood-text   { color: #5060a8; }
.mood-label.excited .face,  .mood-label.excited .mood-text  { color: #c07820; }
.mood-label.confused .face, .mood-label.confused .mood-text { color: #888840; }
.mood-label.neutral .face,  .mood-label.neutral .mood-text  { color: #707070; }
.mood-label.bored .face,    .mood-label.bored .mood-text    { color: #7858a0; }
        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-accent);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }

        .toolbar button {
            position: relative;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toolbar button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .toolbar button:hover { color: var(--accent); background: var(--accent-dim); border-color: var(--border-accent); box-shadow: 0 0 10px var(--accent-glow); }

        .toolbar button[title]::after {
            content: attr(title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%) translateY(-3px);
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.68rem;
            font-family: 'Georgia', serif;
            padding: 4px 8px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 10;
        }
        .toolbar button[title]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

        .toolbar .divider-line { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

        .toolbar .attach-btn { margin-left: auto; opacity: 0.5; }
        .toolbar .attach-btn:hover { opacity: 1; }

        /* ── Writing area ── */
        .write-wrap {
            position: relative;
            border: 1px solid var(--border-accent);
            border-top: none;
            border-radius: 0 0 10px 10px;
            padding: 20px 20px 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: var(--bg-secondary);
        }

        .write-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim), 0 0 30px var(--accent-glow);
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 0 0 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.85;
            outline: none;
            resize: vertical;
            caret-color: var(--accent);
        }

        textarea::placeholder { color: var(--text-muted); }

        .write-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
        }

        .autosave { display: flex; align-items: center; gap: 6px; color: var(--text-muted); transition: color 0.3s; }
        .autosave.is-dirty { color: var(--accent); }
        .autosave .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; animation: pulseDot 2s ease-in-out infinite; box-shadow: 0 0 8px var(--accent-glow); }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }

        .counter { letter-spacing: 0.02rem; color: var(--text-muted); }
        .counter.near-limit { color: var(--accent); }

        /* ── Action buttons ── */
        .actions-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .left-actions, .right-actions { display: flex; gap: 12px; }

        button[type="button"].delete-entry {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--danger);
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.84rem;
            letter-spacing: 0.02rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button[type="button"].delete-entry:hover {
            background: rgba(201,112,112,0.08);
            border-color: var(--danger);
            transform: translateY(-1px);
        }

        button[type="button"].delete-entry svg { width: 0.95em; height: 0.95em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        a.discard-btn {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--text-subtle);
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.84rem;
            letter-spacing: 0.03rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        a.discard-btn:hover {
            border-color: var(--text-muted);
            color: var(--text);
            transform: translateY(-1px);
        }

        button[type="submit"] {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.84rem;
            font-weight: 500;
            letter-spacing: 0.06rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* ── Delete confirmation modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .modal-box .modal-icon {
            width: 1.8rem;
            height: 1.8rem;
            margin: 0 auto 14px;
            opacity: 0.85;
        }

        .modal-box .modal-icon svg { width: 100%; height: 100%; fill: none; stroke: var(--danger); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .modal-box h3 { color: var(--accent); font-size: 1.2rem; margin-bottom: 12px; }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .modal-btn.cancel:hover { color: var(--accent); border: 1px solid var(--accent); }

        .modal-btn.confirm {
            background-color: var(--danger);
            color: #fff5f0;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .modal-btn.confirm:hover { background-color: var(--danger-hover); }

        /* ── Updated Mobile Responsive Styles ── */
@media (max-width: 640px) {
    body { 
        padding: 24px 20px; 
    }

    /* Force true horizontal centering for form elements */
    .editor,
    .meta-row,
    .draft-banner {
        margin-left: auto !important;
        margin-right: auto !important;
        width: 100%;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
    }

    .nav-links {
        width: 100%;
        gap: 8px;
        opacity: 1;
    }

    .nav-links a {
        flex: 1 1 0;
        min-width: 0;
        padding: 8px 10px;
        font-size: 0.74rem;
    }

    /* Equalized framing lines to fix left/right offset */
    .border-top, .border-bottom { left: 16px; right: 16px; }
    .border-left, .border-right { top: 16px; bottom: 16px; }
    .border-top { top: 16px; }
    .border-bottom { bottom: 16px; }
    .border-left { left: 16px; }
    .border-right { right: 16px; }

    .corner-tl { top: 6px; left: 6px; width: 60px; }
    .corner-tr { top: 6px; right: 6px; width: 80px; }
    .corner-bl { bottom: 6px; left: 6px; width: 80px; }
    .corner-br { bottom: 6px; right: 6px; width: 60px; }

    textarea {
        min-height: 260px;
    }
}
    </style>
</head>
<body>

    <canvas id="bg"></canvas>

    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <div class="corner-deco corner-tl">
        <svg viewBox="0 0 90 90" fill="none">

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawScene();
        }

        function getCloudRGB() {
            const s = getComputedStyle(document.documentElement);
            return {
                r: s.getPropertyValue('--cloud-r').trim() || '200',
                g: s.getPropertyValue('--cloud-g').trim() || '160',
                b: s.getPropertyValue('--cloud-b').trim() || '90',
            };
        }

        function drawCloud(x, y, size, alpha) {
            const { r, g, b } = getCloudRGB();
            [[0,0,size],[size*.6,-size*.2,size*.75],[-size*.5,-size*.1,size*.7],
             [size*.2,-size*.5,size*.6],[-size*.2,-size*.55,size*.55]
            ].forEach(([cx, cy, r2]) => {
                const grad = ctx.createRadialGradient(x+cx,y+cy,0,x+cx,y+cy,r2);
                grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x+cx,y+cy,r2,0,Math.PI*2);
                ctx.fill();
            });
        }

        function drawSparkle(x, y, size, alpha) {
            const { r, g, b } = getCloudRGB();
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x,y-size); ctx.lineTo(x,y+size);
            ctx.moveTo(x-size,y); ctx.lineTo(x+size,y);
            ctx.moveTo(x-size*.6,y-size*.6); ctx.lineTo(x+size*.6,y+size*.6);
            ctx.moveTo(x+size*.6,y-size*.6); ctx.lineTo(x-size*.6,y+size*.6);
            ctx.stroke();
            ctx.restore();
        }

        const petals = Array.from({ length: 35 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 7 + 3,
            speedX: Math.random() * .6 - .3,
            speedY: Math.random() * .8 + .3,
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - .5) * .03,
            opacity: Math.random() * .5 + .2,
            sway: Math.random() * Math.PI * 2,
        }));

        function drawSakuraScene() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            petals.forEach(p => {
                p.sway += .008;
                p.x += p.speedX*.4 + Math.sin(p.sway)*.3;
                p.y += p.speedY*.4;
                p.rotation += p.rotationSpeed*.5;
                if (p.y > h+20) { p.y = -10; p.x = Math.random()*w; }
                ctx.save();
                ctx.translate(p.x,p.y); ctx.rotate(p.rotation);
                ctx.globalAlpha = p.opacity*.7;
                ctx.fillStyle = 'rgba(240,140,170,0.9)';
                ctx.beginPath();
                ctx.ellipse(0,0,p.size*.5,p.size*.9,0,0,Math.PI*2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStaticScene() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            [[0,h,140,.13],[w*.15,h,110,.13],[w,h,140,.13],[w*.85,h,110,.13],
             [0,0,125,.16],[w*.12,0,95,.16],[w,0,125,.16],[w*.88,0,95,.16]
            ].forEach(([x,y,s,a]) => drawCloud(x,y,s,a));
            [[w*.1,h*.2,5],[w*.9,h*.15,4],[w*.05,h*.7,6],[w*.95,h*.75,5],
             [w*.2,h*.05,4],[w*.8,h*.08,6],[w*.15,h*.92,5],[w*.85,h*.9,4],
             [w*.5,h*.03,3],[w*.3,h*.97,4],[w*.7,h*.95,5],[w*.02,h*.45,4],
             [w*.98,h*.5,5],[w*.25,h*.12,3],[w*.75,h*.88,4]
            ].forEach(([x,y,s]) => drawSparkle(x,y,s,.7));
        }

        let sakuraFrame = null;
        function drawScene() {
            if (sakuraFrame) { cancelAnimationFrame(sakuraFrame); sakuraFrame = null; }
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'sakura') {
                (function loop() { drawSakuraScene(); sakuraFrame = requestAnimationFrame(loop); })();
            } else {
                drawStaticScene();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const savedTheme = localStorage.getItem('oneiric-theme') || 'default';
        if (savedTheme === 'default') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', savedTheme);
        drawScene();
    </script>

    <script>
        // ── Mood selector wiring ──
        const moodInput = document.getElementById('moodInput');
        const moodLabels = document.querySelectorAll('.mood-label');

        function setMood(mood) {
            moodInput.value = mood;
            moodLabels.forEach(el => {
                el.classList.toggle('selected', el.dataset.mood === mood);
            });
        }

        moodLabels.forEach(el => {
            el.addEventListener('click', () => {
                if (moodInput.value === el.dataset.mood) {
                    setMood('');
                } else {
                    setMood(el.dataset.mood);
                }
                markDirty();
            });
        });

        if (moodInput.value) setMood(moodInput.value);

        // ── Character counter + dirty state ──
        const contentInput = document.getElementById('contentInput');
        const charCount = document.getElementById('charCount');
        const statusText = document.getElementById('statusText');
        const autosaveWrap = document.getElementById('autosaveWrap');
        const MAX_CHARS = 10000;

        function updateCharCount() {
            const len = contentInput.value.length;
            charCount.textContent = `${len.toLocaleString()} / ${MAX_CHARS.toLocaleString()}`;
            charCount.classList.toggle('near-limit', len > MAX_CHARS * 0.9);
        }
        updateCharCount();

        let dirty = false;
        function markDirty() {
            if (!dirty) {
                dirty = true;
                statusText.textContent = 'Unsaved changes';
                autosaveWrap.classList.add('is-dirty');
            }
            updateCharCount();
        }

        contentInput.addEventListener('input', markDirty);
        document.getElementById('titleInput').addEventListener('input', markDirty);

        document.getElementById('editForm').addEventListener('submit', () => {
            dirty = false;
        });

        // ── Formatting helpers ──
        function wrapSelection(before, after) {
            const s = contentInput.selectionStart;
            const e = contentInput.selectionEnd;
            const v = contentInput.value;
            const sel = v.substring(s, e);
            contentInput.value = v.substring(0,s) + before + sel + after + v.substring(e);
            contentInput.focus();
            contentInput.selectionStart = s + before.length;
            contentInput.selectionEnd   = s + before.length + sel.length;
            markDirty();
        }

        function insertText(text) {
            const s = contentInput.selectionStart;
            const v = contentInput.value;
            contentInput.value = v.substring(0,s) + text + v.substring(s);
            contentInput.focus();
            const pos = s + text.length;
            contentInput.selectionStart = contentInput.selectionEnd = pos;
            markDirty();
        }

        document.addEventListener('keydown', function(e) {
            const meta = e.ctrlKey || e.metaKey;
            if (meta && e.key.toLowerCase() === 'b' && document.activeElement === contentInput) {
                e.preventDefault(); wrapSelection('**','**');
            }
            if (meta && e.key.toLowerCase() === 'i' && document.activeElement === contentInput) {
                e.preventDefault(); wrapSelection('_','_');
            }
            if (meta && e.key.toLowerCase() === 's') {
                e.preventDefault();
                document.getElementById('editForm').requestSubmit();
            }
        });

        // ── Delete modal ──
        function openDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }
        function submitDelete() {
            document.getElementById('deleteForm').submit();
        }
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });
    </script>
