<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Write</title>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* Corner decorations */
        .corner {
            position: fixed;
            font-size: 1.2rem;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            color: #c9a96e;
            line-height: 1;
        }

        .corner-tl { top: 16px; left: 16px; }
        .corner-tr { top: 16px; right: 16px; transform: scaleX(-1); }
        .corner-bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
        .corner-br { bottom: 16px; right: 16px; transform: scale(-1); }

        /* Border lines */
        .border-top, .border-bottom {
            position: fixed;
            left: 48px;
            right: 48px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a96e44, #c9a96e88, #c9a96e44, transparent);
            pointer-events: none;
            z-index: 0;
        }

        .border-top { top: 48px; }
        .border-bottom { bottom: 48px; }

        .border-left, .border-right {
            position: fixed;
            top: 48px;
            bottom: 48px;
            width: 1px;
            background: linear-gradient(180deg, transparent, #c9a96e44, #c9a96e88, #c9a96e44, transparent);
            pointer-events: none;
            z-index: 0;
        }

        .border-left { left: 48px; }
        .border-right { right: 48px; }

        /* Floating stars at corners */
        .deco-star {
            position: fixed;
            color: #c9a96e;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
            font-size: var(--sz);
            animation: twinkle var(--dur) ease-in-out infinite var(--del);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.35; }
        }

        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        h1 { color: #c9a96e; font-size: 1.8rem; letter-spacing: 0.15rem; }

        a.back {
            color: #9e9589;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back:hover { color: #c9a96e; }

        .editor {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2e2e2e;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
        }

        input[type="text"]::placeholder { color: #444; }
        input[type="text"]:focus { border-bottom-color: #c9a96e; }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px 0;
            background: transparent;
            border: none;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.8;
            outline: none;
            resize: none;
        }

        textarea::placeholder { color: #444; }

        button {
            align-self: flex-end;
            padding: 12px 32px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover { background-color: #b8935a; }

      .mood-group-label {
    color: #9e9589;
    font-size: 1rem;
    align-self: center;
    letter-spacing: 0.03rem;
}

.mood-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 12px;
    background-color: #1a1a1a;
    border: 1px solid #2e2e2e;
    border-radius: 18px;
    font-family: 'Georgia', serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}

.mood-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    padding: 8px 0;
    width: 100%;
}

.mood-label:hover { border-color: #c9a96e; }
.mood-label input[type="radio"] { display: none; }
.mood-label:has(input:checked) {
    border-color: #c9a96e;
    background-color: #1e1a0e;
}

.mood-label.happy .face,    .mood-label.happy .mood-text    { color: #ffd9a0; }
.mood-label.calm .face,     .mood-label.calm .mood-text     { color: #a8e0d0; }
.mood-label.sad .face,      .mood-label.sad .mood-text      { color: #a8c8f0; }
.mood-label.anxious .face,  .mood-label.anxious .mood-text  { color: #d8b0e8; }
.mood-label.angry .face,    .mood-label.angry .mood-text    { color: #f0a8a8; }
.mood-label.lonely .face,   .mood-label.lonely .mood-text   { color: #b0b8d8; }
.mood-label.excited .face,  .mood-label.excited .mood-text  { color: #ffcfa0; }
.mood-label.confused .face, .mood-label.confused .mood-text { color: #d0d0a0; }
.mood-label.neutral .face,  .mood-label.neutral .mood-text  { color: #c0c0c0; }
.mood-label.bored .face, .mood-label.bored .mood-text { color: #b8a8c8; }
        
        .nav-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    border-radius: 20px;
    text-decoration: none;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    min-width: 140px;
    box-sizing: border-box;
    text-align: center;
}

.nav-links a.chamber-link {
    background-color: #1a1a1a;
    color: #8a8175;
    font-size: 0.95rem;
}

.nav-links a.chamber-link:hover {
    color: #c9a96e;
    border-color: #c9a96e;
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.25);
}


.nav-links a.btn {
    background-color: #c9a96e;
    color: #0d0d0d;
}

.nav-links a.btn:hover {
    background-color: #b8935a;
    border-color: #c9a96e;
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.35);
}
        
    </style>
</head>
<body>

    <!-- Frame decoration -->
    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <div class="corner corner-tl">✦ · · ·<br>·<br>·</div>
    <div class="corner corner-tr">✦ · · ·<br>·<br>·</div>
    <div class="corner corner-bl">·<br>·<br>✦ · · ·</div>
    <div class="corner corner-br">·<br>·<br>✦ · · ·</div>

    <div class="deco-star" style="top:60px; left:80px; --sz:0.7rem; --dur:3s; --del:0s;">✧</div>
    <div class="deco-star" style="top:60px; right:80px; --sz:0.6rem; --dur:4s; --del:1s;">✦</div>
    <div class="deco-star" style="bottom:60px; left:80px; --sz:0.6rem; --dur:3.5s; --del:0.5s;">✧</div>
    <div class="deco-star" style="bottom:60px; right:80px; --sz:0.7rem; --dur:4s; --del:2s;">✦</div>
    <div class="deco-star" style="top:50%; left:52px; --sz:0.5rem; --dur:5s; --del:1s;">·</div>
    <div class="deco-star" style="top:50%; right:52px; --sz:0.5rem; --dur:5s; --del:2s;">·</div>
 <div class="header">
    <h1>🌙 Write</h1>
    <div class="nav-links">
        <a href="/chamber" class="chamber-link">🌙 Chamber</a>
        <a href="/entries" class="btn">💖 Entries</a>
    </div>
</div>

    <form class="editor" method="post" action="/entries/new">
        <input type="text" name="title" placeholder="Give it a Title..." required />
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <span class="mood-group-label">Mood:</span>
</div>
<div class="mood-row">
    <label class="mood-label happy"><input type="radio" name="mood" value="happy"><span class="face">(❁´◡`❁)</span> <span class="mood-text">Happy</span></label>
    <label class="mood-label calm"><input type="radio" name="mood" value="calm"><span class="face">^_^</span> <span class="mood-text">Calm</span></label>
    <label class="mood-label sad"><input type="radio" name="mood" value="sad"><span class="face">＞︿＜</span> <span class="mood-text">Sad</span></label>
    <label class="mood-label anxious"><input type="radio" name="mood" value="anxious"><span class="face">＞﹏＜</span> <span class="mood-text">Anxious</span></label>
    <label class="mood-label angry"><input type="radio" name="mood" value="angry"><span class="face">(╬▔皿▔)╯</span> <span class="mood-text">Angry</span></label>
    <label class="mood-label lonely"><input type="radio" name="mood" value="lonely"><span class="face">( ﾉ ﾟｰﾟ)ﾉ</span> <span class="mood-text">Lonely</span></label>
    <label class="mood-label excited"><input type="radio" name="mood" value="excited"><span class="face">(≧∀≦)ゞ</span> <span class="mood-text">Excited</span></label>
    <label class="mood-label confused"><input type="radio" name="mood" value="confused"><span class="face">*-*</span> <span class="mood-text">Confused</span></label>
    <label class="mood-label neutral"><input type="radio" name="mood" value="neutral"><span class="face">^_____^</span> <span class="mood-text">Neutral</span></label>
    <label class="mood-label bored"><input type="radio" name="mood" value="bored"><span class="face">–_–</span> <span class="mood-text">Bored</span></label>
</div>
        <textarea name="content" placeholder="What's on your mind..."></textarea>
        <button type="submit">Save to Chamber</button>
    </form>
</body>
</html>
