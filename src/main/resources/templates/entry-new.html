<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <title>Oneiric — Write</title>
    <style>

        :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #6e6858;
            --accent: #d4b478;
            --accent-hover: #c29a5c;
            --accent-dim: rgba(212,180,120,0.12);
            --accent-glow: rgba(212,180,120,0.22);
            --border: #2e2e2e;
            --border-accent: rgba(212,180,120,0.28);
            --cloud-r: 200; --cloud-g: 160; --cloud-b: 90;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0; --bg-secondary: #fff0f3; --bg-tertiary: #ffe4ec;
            --text: #4a3040; --text-muted: #9e7080; --text-subtle: #c4a0b0;
            --accent: #e8829a; --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --accent-glow: rgba(232,130,154,0.18);
            --border: #f0c0d0; --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
        }

 [data-theme="abyss"] {
    --bg: #050d1a;
    --bg-secondary: #0a1628;
    --bg-tertiary: #0f1e35;
    --text: #c8d8f0;
    --text-muted: #8098c0;
    --text-subtle: #4a6088;
    --accent: #d4b56a;
    --accent-hover: #c9a253;
    --accent-dim: rgba(212,181,106,0.12);
    --border: #1a2e48;
    --border-accent: rgba(212,181,106,0.25);
    --cloud-r: 212; --cloud-g: 181; --cloud-b: 106;
    --star-color: #d4b56a;
}

        [data-theme="sage"] {
            --bg: #f4f6f0; --bg-secondary: #eaefe4; --bg-tertiary: #dde5d4;
            --text: #2d3828; --text-muted: #6e8060; --text-subtle: #a0b090;
            --accent: #7a9e6e; --accent-hover: #5e8050;
            --accent-dim: rgba(122,158,110,0.08);
            --accent-glow: rgba(122,158,110,0.18);
            --border: #c8d8b8; --border-accent: rgba(122,158,110,0.3);
            --cloud-r: 122; --cloud-g: 158; --cloud-b: 110;
        }

        [data-theme="noir"] {
            --bg: #000000; --bg-secondary: #0a0a0a; --bg-tertiary: #141414;
            --text: #ffffff; --text-muted: #888888; --text-subtle: #444444;
            --accent: #ffffff; --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --accent-glow: rgba(255,255,255,0.12);
            --border: #222222; --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding: 40px;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            animation: pageFadeIn 0.6s ease-out;
        }

        @keyframes pageFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ── Corner decorations ── */
        .corner-deco {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: 0.28;
            color: var(--accent);
            animation: gentleDrift 6s ease-in-out infinite;
        }

        .corner-deco svg { display: block; overflow: visible; }
        .corner-tl { top: 20px; left: 20px; width: 110px; }
        .corner-tr { top: 20px; right: 20px; width: 160px; }
        .corner-bl { bottom: 20px; left: 20px; width: 160px; }
        .corner-br { bottom: 20px; right: 20px; width: 120px; }

        .vine { stroke: var(--accent); stroke-width: 1.3; fill: none; stroke-linecap: round; }
        .bud  { fill: var(--accent); opacity: 0.75; }
        .book-deco { stroke: var(--accent); stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes gentleDrift {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .deco-star {
            position: fixed;
            color: var(--accent);
            pointer-events: none;
            z-index: 0;
            font-size: var(--sz);
            opacity: var(--base-op, 0.22);
            animation: twinkle var(--dur) ease-in-out infinite var(--del);
        }

        @keyframes twinkle {
            0%, 100% { opacity: calc(var(--base-op, 0.22) * 0.4); transform: scale(0.85); }
            50% { opacity: calc(var(--base-op, 0.22) * 1.6); transform: scale(1.15); }
        }

        .border-top, .border-bottom {
            position: fixed; left: 48px; right: 48px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-accent), var(--accent-hover), var(--border-accent), transparent);
            opacity: 0.6; pointer-events: none; z-index: 0;
        }
        .border-top { top: 48px; }
        .border-bottom { bottom: 48px; }

        .border-left, .border-right {
            position: fixed; top: 48px; bottom: 48px; width: 1px;
            background: linear-gradient(180deg, transparent, var(--border-accent), var(--accent-hover), var(--border-accent), transparent);
            opacity: 0.6; pointer-events: none; z-index: 0;
        }
        .border-left { left: 48px; }
        .border-right { right: 48px; }

        /* ── Header ── */
        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            row-gap: 12px;
        }

        h1 {
            color: var(--accent);
            font-size: 1.7rem;
            letter-spacing: 0.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            text-shadow: 0 0 18px var(--accent-glow);
        }

        h1 svg { width: 0.9em; height: 0.9em; fill: var(--accent); }

        .nav-links { display: flex; gap: 8px; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links:hover { opacity: 1; }

        .nav-links a {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            padding: 6px 16px; border-radius: 16px; text-decoration: none;
            font-family: 'Georgia', serif; font-size: 0.76rem;
            border: 1px solid transparent; transition: all 0.2s ease;
            min-width: 92px; box-sizing: border-box; text-align: center;
        }

        .nav-links a.chamber-link {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border-color: var(--border);
        }
        .nav-links a.chamber-link:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .nav-links a.btn {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border-color: var(--border);
        }
        .nav-links a.btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        /* ── Meta row ── */
        .meta-row {
            position: relative; z-index: 1;
            max-width: 700px; margin: 0 auto 20px;
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 8px;
        }

        .datetime { color: var(--text-subtle); font-size: 0.78rem; letter-spacing: 0.03rem; }

        .private-tag {
            display: inline-flex; align-items: center; gap: 5px;
            color: var(--text-subtle); font-size: 0.78rem; letter-spacing: 0.02rem;
        }
        .private-tag svg { width: 0.9em; height: 0.9em; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* ── Draft restore banner ── */
        .draft-banner {
            display: none;
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto 14px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-accent);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .draft-banner.visible { display: flex; }
        .draft-banner .draft-left { display: flex; align-items: center; gap: 8px; }
        .draft-banner .draft-left svg { width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 1.8; flex-shrink: 0; }
        .draft-banner .draft-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .draft-banner button {
            font-family: 'Georgia', serif;
            font-size: 0.76rem;
            padding: 4px 12px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .draft-banner button.resume-btn {
            background: var(--accent);
            color: var(--bg);
            border-color: transparent;
        }
        .draft-banner button.resume-btn:hover { background: var(--accent-hover); }
        .draft-banner button.discard-draft-btn:hover { border-color: #a8686e; color: #c2868b; }

        /* ── Editor ── */
        .editor {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            outline: none;
            transition: border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
            caret-color: var(--accent);
        }

        input[type="text"]::placeholder { color: var(--text-muted); }

        input[type="text"]:focus {
            border-bottom-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 2px 0 -1px var(--accent-glow), 0 6px 18px -8px var(--accent-glow);
        }

        /* ── Mood ── */
        .mood-group-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.03rem;
        }

        .mood-scroll-wrap { position: relative; }

        .mood-scroll-wrap::after {
            content: '';
            display: none;
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 40px;
            background: linear-gradient(to right, transparent, var(--bg));
            pointer-events: none;
            border-radius: 0 16px 16px 0;
        }

        @media (max-width: 640px) {
            .mood-scroll-wrap::after { display: block; }
            .mood-row {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                padding-bottom: 4px;
                gap: 6px;
            }
            .mood-row::-webkit-scrollbar { display: none; }
            .mood-label { flex-shrink: 0; }
        }

        .mood-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
            gap: 6px;
            padding: 2px 0 4px;
            width: 100%;
        }

        .mood-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 5px 10px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-family: 'Georgia', serif;
            font-size: 0.74rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .mood-label:hover { border-color: var(--accent); }
        .mood-label input[type="radio"] { display: none; }

        .mood-label:has(input:checked) {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--accent-dim), var(--accent-glow));
            box-shadow: 0 0 0 2px var(--accent-dim), 0 0 18px var(--accent-glow);
        }

        .mood-label:has(input:checked) .face,
        .mood-label:has(input:checked) .mood-text { color: var(--accent) !important; }

        .mood-label.happy .face,    .mood-label.happy .mood-text    { color: #c47a20; }
        .mood-label.calm .face,     .mood-label.calm .mood-text     { color: #3a9e88; }
        .mood-label.sad .face,      .mood-label.sad .mood-text      { color: #4a88c8; }
        .mood-label.anxious .face,  .mood-label.anxious .mood-text  { color: #9060c0; }
        .mood-label.angry .face,    .mood-label.angry .mood-text    { color: #c84040; }
        .mood-label.lonely .face,   .mood-label.lonely .mood-text   { color: #5060a8; }
        .mood-label.excited .face,  .mood-label.excited .mood-text  { color: #c07820; }
        .mood-label.confused .face, .mood-label.confused .mood-text { color: #888840; }
        .mood-label.neutral .face,  .mood-label.neutral .mood-text  { color: #707070; }
        .mood-label.bored .face,    .mood-label.bored .mood-text    { color: #7858a0; }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-accent);
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }

        .toolbar button {
            position: relative;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toolbar button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .toolbar button:hover { color: var(--accent); background: var(--accent-dim); border-color: var(--border-accent); box-shadow: 0 0 10px var(--accent-glow); }

        .toolbar button[title]::after {
            content: attr(title);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%) translateY(-3px);
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.68rem;
            font-family: 'Georgia', serif;
            padding: 4px 8px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 10;
        }
        .toolbar button[title]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

        .toolbar .divider-line { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

        .toolbar .attach-btn { margin-left: auto; opacity: 0.5; }
        .toolbar .attach-btn:hover { opacity: 1; }

        /* ── Writing area ── */
        .write-wrap {
            position: relative;
            border: 1px solid var(--border-accent);
            border-top: none;
            border-radius: 0 0 10px 10px;
            padding: 20px 20px 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: var(--bg-secondary);
        }

        .write-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim), 0 0 30px var(--accent-glow);
        }

        textarea {
            width: 100%;
            min-height: 360px;
            padding: 0 0 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Georgia', serif;
            font-size: 1rem;
            line-height: 1.85;
            outline: none;
            resize: none;
            caret-color: var(--accent);
        }

        textarea::placeholder { color: var(--text-muted); }

        .write-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 12px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
        }

        .autosave { display: flex; align-items: center; gap: 6px; color: var(--text-muted); transition: color 0.3s; }
        .autosave.is-saved { color: var(--accent); }
        .autosave .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; animation: pulseDot 2s ease-in-out infinite; box-shadow: 0 0 8px var(--accent-glow); }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }

        .counter { letter-spacing: 0.02rem; color: var(--text-muted); }
        .counter.near-limit { color: var(--accent); }

        /* ── Action buttons ── */
        .actions-row {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            align-items: center;
            margin-top: 4px;
        }

        button[type="button"].discard-btn {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid var(--border-accent);
            color: var(--text-subtle);
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.84rem;
            letter-spacing: 0.03rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button[type="button"].discard-btn:hover {
            border-color: #a8686e;
            color: #c2868b;
            transform: translateY(-1px);
        }

        button[type="submit"] {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 0.84rem;
            font-weight: 500;
            letter-spacing: 0.06rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* ── Save confirmation ── */
        .save-confirm {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center;
            z-index: 300; pointer-events: none;
            background: rgba(0,0,0,0.3);
        }
        .save-confirm.show { display: flex; }
        .save-confirm .badge {
            width: 84px; height: 84px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--accent-glow), 0 0 90px var(--accent-glow);
            animation: badgePop 0.5s ease;
            background: var(--bg-tertiary);
        }
        .save-confirm .badge svg { width: 36px; height: 36px; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes badgePop {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-accent);
            color: var(--text-muted);
            font-family: 'Georgia', serif;
            font-size: 0.8rem;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Discard confirm modal ── */
        .confirm-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: 200;
            align-items: center; justify-content: center;
        }
        .confirm-modal.open { display: flex; }
        .confirm-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 32px;
            text-align: center;
            max-width: 320px;
        }
        .confirm-box p { color: var(--text); margin-bottom: 6px; font-size: 0.95rem; }
        .confirm-box .confirm-sub { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; display: block; }
        .confirm-actions { display: flex; gap: 12px; justify-content: center; }
        .confirm-actions button, .confirm-actions a {
            padding: 10px 20px; border-radius: 6px;
            font-family: 'Georgia', serif; font-size: 0.88rem;
            cursor: pointer; text-decoration: none;
            border: 1px solid var(--border);
            background: transparent; color: var(--text-muted);
            transition: all 0.2s;
        }
        .confirm-actions button:hover { border-color: var(--accent); color: var(--accent); }
        .confirm-actions .danger-confirm { background: #a8686e; color: #fff; border-color: transparent; }
        .confirm-actions .danger-confirm:hover { background: #c2868b; }

        @media (max-width: 640px) {
            body { padding: 24px 16px; }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .nav-links {
                width: 100%;
                gap: 8px;
                opacity: 1;
            }

            .nav-links a {
                flex: 1 1 0;
                min-width: 0;
                padding: 8px 10px;
                font-size: 0.74rem;
            }

            .border-top, .border-bottom { left: 20px; right: 20px; }
            .border-left, .border-right { top: 20px; bottom: 20px; }
            .border-top { top: 20px; }
            .border-bottom { bottom: 20px; }
            .border-left { left: 20px; }
            .border-right { right: 20px; }
        }

    </style>
</head>
<body>

    <canvas id="bg"></canvas>

    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <div class="corner-deco corner-tl">

    <div class="corner-deco corner-tr">

            <path class="vine" d="M158 2 C138 8 120 18 106 32 C96 42 90 52 88 62 C86 72 90 80 100 82 C110 84 116 76 112 68 C108 60 98 60 96 68"/>
            <path class="vine" d="M120 8 C104 16 92 28 84 42 C78 52 76 62 78 70 C80 78 88 82 94 78 C100 74 98 66 92 66" opacity="0.7"/>

            <path class="vine" d="M70 20 C60 26 52 34 46 44" opacity="0.5"/>

        </svg>
    </div>

    <div class="corner-deco corner-bl">
        <svg viewBox="0 0 160 140" fill="none">
            <path class="vine" d="M2 138 C30 136 60 126 80 106 C96 90 106 70 110 48 C112 36 112 24 110 14"/>
            <path class="vine" d="M2 138 C22 132 40 122 54 108 C64 98 70 88 72 78 C74 68 70 60 60 58 C50 56 44 64 48 72 C52 80 62 80 64 72"/>
            <path class="vine" d="M40 132 C56 124 68 112 76 98 C82 88 84 78 82 70 C80 62 72 58 66 62 C60 66 62 74 68 74" opacity="0.7"/>
            <circle class="bud" cx="66" cy="62" r="2.5"/>
            <circle class="bud" cx="60" cy="58" r="2"/>

    <div class="corner-deco corner-br">
        <svg viewBox="0 0 110 80" fill="none">
            <path class="book-deco" d="M55 20 C48 14 36 12 26 14 L26 60 C36 58 48 60 55 66"/>
            <path class="book-deco" d="M55 20 C62 14 74 12 84 14 L84 60 C74 58 62 60 55 66"/>
            <path class="book-deco" d="M55 20 L55 66" opacity="0.5"/>
            <path class="book-deco" d="M32 24 L48 22" opacity="0.5"/>
            <path class="book-deco" d="M32 32 L48 30" opacity="0.5"/>
            <path class="book-deco" d="M32 40 L46 38" opacity="0.5"/>
            <path class="book-deco" d="M62 22 L78 24" opacity="0.5"/>
            <path class="book-deco" d="M62 30 L78 32" opacity="0.5"/>
            <path class="book-deco" d="M64 38 L78 40" opacity="0.5"/>
        </svg>
    </div>

    <div class="deco-star" style="top:64px;  left:110px;  --sz:0.55rem; --dur:3s;   --del:0s;   --base-op:0.22;">✧</div>
    <div class="deco-star" style="top:96px;  left:70px;   --sz:0.4rem;  --dur:4.2s; --del:0.8s; --base-op:0.16;">·</div>
    <div class="deco-star" style="top:28px;  left:150px;  --sz:0.65rem; --dur:3.6s; --del:1.4s; --base-op:0.22;">✦</div>
    <div class="deco-star" style="top:60px;  right:130px; --sz:0.5rem;  --dur:3.4s; --del:0.4s; --base-op:0.18;">✧</div>
    <div class="deco-star" style="top:110px; right:80px;  --sz:0.45rem; --dur:4.6s; --del:1.8s; --base-op:0.16;">·</div>
    <div class="deco-star" style="bottom:70px;  left:130px;  --sz:0.5rem;  --dur:3.8s; --del:0.6s; --base-op:0.18;">✦</div>
    <div class="deco-star" style="bottom:110px; left:80px;   --sz:0.4rem;  --dur:4.4s; --del:1.2s; --base-op:0.14;">·</div>
    <div class="deco-star" style="bottom:100px; right:140px; --sz:0.6rem;  --dur:3.2s; --del:0.2s; --base-op:0.22;">✧</div>
    <div class="deco-star" style="bottom:60px;  right:90px;  --sz:0.4rem;  --dur:5s;   --del:2s;   --base-op:0.14;">·</div>
    <div class="deco-star" style="top:50%; left:52px;  --sz:0.5rem; --dur:5s; --del:1s; --base-op:0.16;">·</div>
    <div class="deco-star" style="top:50%; right:52px; --sz:0.5rem; --dur:5s; --del:2s; --base-op:0.16;">·</div>

    <div class="header">
        <h1>
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            Write
        </h1>
        <div class="nav-links">
            <a href="/chamber" class="chamber-link">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="flex-shrink:0;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                Chamber
            </a>
            <a href="/entries" class="btn">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5z"/><path d="M12 6v13"/></svg>
                Entries
            </a>
        </div>
    </div>

    <div class="meta-row">
        <span class="datetime" id="dateTimeLabel"></span>
        <span class="private-tag">
            <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
            Only you can see this
        </span>
    </div>

    <div class="draft-banner" id="draftBanner">
        <div class="draft-left">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            <span>You have an unfinished entry. Resume where you left off?</span>
        </div>
        <div class="draft-actions">
            <button class="discard-draft-btn" onclick="discardDraft()">Discard draft</button>
            <button class="resume-btn" onclick="resumeDraft()">Resume</button>
        </div>
    </div>

    <form class="editor" method="post" action="/entries/new" id="entryForm">
        <input type="text" name="title" id="titleInput" placeholder="Give it a Title..." required />

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="mood-group-label">Mood:</span>
        </div>

        <div class="mood-scroll-wrap">
            <div class="mood-row">
                <label class="mood-label happy"><input type="radio" name="mood" value="happy"><span class="face">(❁´◡`❁)</span> <span class="mood-text">Happy</span></label>
                <label class="mood-label calm"><input type="radio" name="mood" value="calm"><span class="face">^_^</span> <span class="mood-text">Calm</span></label>
                <label class="mood-label sad"><input type="radio" name="mood" value="sad"><span class="face">＞︿＜</span> <span class="mood-text">Sad</span></label>
                <label class="mood-label anxious"><input type="radio" name="mood" value="anxious"><span class="face">＞﹏＜</span> <span class="mood-text">Anxious</span></label>
                <label class="mood-label angry"><input type="radio" name="mood" value="angry"><span class="face">(╬▔皿▔)╯</span> <span class="mood-text">Angry</span></label>
                <label class="mood-label lonely"><input type="radio" name="mood" value="lonely"><span class="face">( ﾉ ﾟｰﾟ)ﾉ</span> <span class="mood-text">Lonely</span></label>
                <label class="mood-label excited"><input type="radio" name="mood" value="excited"><span class="face">(≧∀≦)ゞ</span> <span class="mood-text">Excited</span></label>
                <label class="mood-label confused"><input type="radio" name="mood" value="confused"><span class="face">*-*</span> <span class="mood-text">Confused</span></label>
                <label class="mood-label neutral"><input type="radio" name="mood" value="neutral"><span class="face">^_____^</span> <span class="mood-text">Neutral</span></label>
                <label class="mood-label bored"><input type="radio" name="mood" value="bored"><span class="face">–_–</span> <span class="mood-text">Bored</span></label>
            </div>
        </div>

        <div>
            <div class="toolbar">
                <button type="button" title="Bold (Ctrl+B)" onclick="wrapSelection('**','**')">
                    <svg viewBox="0 0 24 24"><path d="M6 4h7a4 4 0 0 1 0 8H6z"/><path d="M6 12h8a4 4 0 0 1 0 8H6z"/></svg>
                </button>
                <button type="button" title="Italic (Ctrl+I)" onclick="wrapSelection('_','_')">
                    <svg viewBox="0 0 24 24"><line x1="10" y1="4" x2="18" y2="4"/><line x1="6" y1="20" x2="14" y2="20"/><line x1="14" y1="4" x2="10" y2="20"/></svg>
                </button>
                <button type="button" title="Quote" onclick="wrapSelection('\n> ','')">
                    <svg viewBox="0 0 24 24"><path d="M7 8c-2 1-3 3-3 5.5S6 18 8 18"/><path d="M15 8c-2 1-3 3-3 5.5s2 4.5 4 4.5"/></svg>
                </button>
                <button type="button" title="List" onclick="wrapSelection('\n- ','')">
                    <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
                </button>
                <button type="button" title="Divider" onclick="insertText('\n---\n')">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/></svg>
                </button>
                <div class="divider-line"></div>
                <button type="button" class="attach-btn" title="Add image (coming soon)" onclick="showToast('Image attachments are coming soon ✦')">
                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-4 4"/></svg>
                </button>
            </div>

            <div class="write-wrap">
                <textarea name="content" id="contentArea" placeholder="What's on your mind..." maxlength="10000"></textarea>
                <div class="write-footer">
                    <span class="autosave" id="autosaveWrap">
                        <span class="dot"></span>
                        <span id="autosaveLabel">Draft saved</span>
                    </span>
                    <span class="counter" id="counterLabel">0 / 10,000</span>
                </div>
            </div>
        </div>

        <div class="actions-row">
            <button type="button" class="discard-btn" onclick="confirmDiscard()">Discard</button>
            <button type="submit">Save to Chamber</button>
        </div>
    </form>

    <div class="save-confirm" id="saveConfirm">
        <div class="badge">
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="confirm-modal" id="discardModal">
        <div class="confirm-box">
            <p>Discard this entry?</p>
            <span class="confirm-sub">Your writing will be lost.</span>
            <div class="confirm-actions">
                <button onclick="closeDiscard()">Keep writing</button>
                <a href="/entries" class="danger-confirm">Discard</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawScene();
        }

        function getCloudRGB() {
            const s = getComputedStyle(document.documentElement);
            return {
                r: s.getPropertyValue('--cloud-r').trim() || '200',
                g: s.getPropertyValue('--cloud-g').trim() || '160',
                b: s.getPropertyValue('--cloud-b').trim() || '90',
            };
        }

        function drawCloud(x, y, size, alpha) {
            const { r, g, b } = getCloudRGB();
            [[0,0,size],[size*.6,-size*.2,size*.75],[-size*.5,-size*.1,size*.7],
             [size*.2,-size*.5,size*.6],[-size*.2,-size*.55,size*.55]
            ].forEach(([cx, cy, r2]) => {
                const grad = ctx.createRadialGradient(x+cx,y+cy,0,x+cx,y+cy,r2);
                grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
                grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x+cx,y+cy,r2,0,Math.PI*2);
                ctx.fill();
            });
        }

        function drawSparkle(x, y, size, alpha) {
            const { r, g, b } = getCloudRGB();
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x,y-size); ctx.lineTo(x,y+size);
            ctx.moveTo(x-size,y); ctx.lineTo(x+size,y);
            ctx.moveTo(x-size*.6,y-size*.6); ctx.lineTo(x+size*.6,y+size*.6);
            ctx.moveTo(x+size*.6,y-size*.6); ctx.lineTo(x-size*.6,y+size*.6);
            ctx.stroke();
            ctx.restore();
        }

        const petals = Array.from({ length: 35 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 7 + 3,
            speedX: Math.random() * .6 - .3,
            speedY: Math.random() * .8 + .3,
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - .5) * .03,
            opacity: Math.random() * .5 + .2,
            sway: Math.random() * Math.PI * 2,
        }));

        function drawSakuraScene() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            petals.forEach(p => {
                p.sway += .008;
                p.x += p.speedX*.4 + Math.sin(p.sway)*.3;
                p.y += p.speedY*.4;
                p.rotation += p.rotationSpeed*.5;
                if (p.y > h+20) { p.y = -10; p.x = Math.random()*w; }
                ctx.save();
                ctx.translate(p.x,p.y); ctx.rotate(p.rotation);
                ctx.globalAlpha = p.opacity*.7;
                ctx.fillStyle = 'rgba(240,140,170,0.9)';
                ctx.beginPath();
                ctx.ellipse(0,0,p.size*.5,p.size*.9,0,0,Math.PI*2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStaticScene() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            [[0,h,140,.13],[w*.15,h,110,.13],[w,h,140,.13],[w*.85,h,110,.13],
             [0,0,125,.16],[w*.12,0,95,.16],[w,0,125,.16],[w*.88,0,95,.16]
            ].forEach(([x,y,s,a]) => drawCloud(x,y,s,a));
            [[w*.1,h*.2,5],[w*.9,h*.15,4],[w*.05,h*.7,6],[w*.95,h*.75,5],
             [w*.2,h*.05,4],[w*.8,h*.08,6],[w*.15,h*.92,5],[w*.85,h*.9,4],
             [w*.5,h*.03,3],[w*.3,h*.97,4],[w*.7,h*.95,5],[w*.02,h*.45,4],
             [w*.98,h*.5,5],[w*.25,h*.12,3],[w*.75,h*.88,4]
            ].forEach(([x,y,s]) => drawSparkle(x,y,s,.7));
        }

        let sakuraFrame = null;
        function drawScene() {
            if (sakuraFrame) { cancelAnimationFrame(sakuraFrame); sakuraFrame = null; }
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'sakura') {
                (function loop() { drawSakuraScene(); sakuraFrame = requestAnimationFrame(loop); })();
            } else {
                drawStaticScene();
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const savedTheme = localStorage.getItem('oneiric-theme') || 'default';
        if (savedTheme === 'default') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', savedTheme);
        drawScene();

        function updateDateTime() {
            const now = new Date();
            const date = now.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
            const time = now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
            document.getElementById('dateTimeLabel').textContent = `${date} • ${time}`;
        }
        updateDateTime();

        const contentArea  = document.getElementById('contentArea');
        const counterLabel = document.getElementById('counterLabel');
        const LIMIT = 10000;

        function updateCounter() {
            const len = contentArea.value.length;
            counterLabel.textContent = `${len.toLocaleString()} / ${LIMIT.toLocaleString()}`;
            counterLabel.classList.toggle('near-limit', len > LIMIT * .9);
        }
        contentArea.addEventListener('input', updateCounter);
        updateCounter();

        const DRAFT_KEY = 'oneiric-draft';
        const titleInput    = document.getElementById('titleInput');
        const autosaveLabel = document.getElementById('autosaveLabel');
        const autosaveWrap  = document.getElementById('autosaveWrap');
        let saveTimer = null;

        function saveDraft() {
            const draft = {
                title:   titleInput.value,
                content: contentArea.value,
                mood:    (document.querySelector('input[name="mood"]:checked') || {}).value || '',
                savedAt: Date.now(),
            };
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            autosaveLabel.textContent = 'Draft saved';
            autosaveWrap.classList.add('is-saved');
        }

        function scheduleSave() {
            autosaveLabel.textContent = 'Saving…';
            autosaveWrap.classList.remove('is-saved');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveDraft, 900);
        }

        titleInput.addEventListener('input', scheduleSave);
        contentArea.addEventListener('input', scheduleSave);
        document.querySelectorAll('input[name="mood"]').forEach(r => r.addEventListener('change', scheduleSave));

        (function checkDraft() {
            const raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            try {
                const draft = JSON.parse(raw);
                if (!draft.title && !draft.content) return;
                document.getElementById('draftBanner').classList.add('visible');
            } catch(e) { localStorage.removeItem(DRAFT_KEY); }
        })();

        function resumeDraft() {
            const raw = localStorage.getItem(DRAFT_KEY);
            if (!raw) return;
            try {
                const draft = JSON.parse(raw);
                titleInput.value   = draft.title   || '';
                contentArea.value  = draft.content || '';
                if (draft.mood) {
                    const radio = document.querySelector(`input[name="mood"][value="${draft.mood}"]`);
                    if (radio) radio.checked = true;
                }
                updateCounter();
                autosaveLabel.textContent = 'Draft restored';
                autosaveWrap.classList.add('is-saved');
            } catch(e) {}
            document.getElementById('draftBanner').classList.remove('visible');
        }

        function discardDraft() {
            localStorage.removeItem(DRAFT_KEY);
            document.getElementById('draftBanner').classList.remove('visible');
        }

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        function wrapSelection(before, after) {
            const s = contentArea.selectionStart;
            const e = contentArea.selectionEnd;
            const v = contentArea.value;
            const sel = v.substring(s, e);
            contentArea.value = v.substring(0,s) + before + sel + after + v.substring(e);
            contentArea.focus();
            contentArea.selectionStart = s + before.length;
            contentArea.selectionEnd   = s + before.length + sel.length;
            updateCounter(); scheduleSave();
        }

        function insertText(text) {
            const s = contentArea.selectionStart;
            const v = contentArea.value;
            contentArea.value = v.substring(0,s) + text + v.substring(s);
            contentArea.focus();
            const pos = s + text.length;
            contentArea.selectionStart = contentArea.selectionEnd = pos;
            updateCounter(); scheduleSave();
        }

        document.addEventListener('keydown', function(e) {
            const meta = e.ctrlKey || e.metaKey;
            if (meta && e.key.toLowerCase() === 'b' && document.activeElement === contentArea) {
                e.preventDefault(); wrapSelection('**','**');
            }
            if (meta && e.key.toLowerCase() === 'i' && document.activeElement === contentArea) {
                e.preventDefault(); wrapSelection('_','_');
            }
            if (meta && e.key.toLowerCase() === 's') {
                e.preventDefault();
                document.getElementById('entryForm').requestSubmit();
            }
        });

        function confirmDiscard() { document.getElementById('discardModal').classList.add('open'); }
        function closeDiscard()   { document.getElementById('discardModal').classList.remove('open'); }

        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.removeItem(DRAFT_KEY);
            const overlay = document.getElementById('saveConfirm');
            overlay.classList.add('show');
            setTimeout(() => e.target.submit(), 650);
        });
    </script>
</body>
