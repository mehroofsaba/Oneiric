<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Enter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .chamber {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 { font-size: 2rem; color: #c9a96e; letter-spacing: 0.2rem; }
        p.subtitle { color: #9e9589; font-size: 0.9rem; }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: #c9a96e; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.1rem;
        }

        button:hover { background-color: #b8935a; }
        a { color: #9e9589; font-size: 0.9rem; text-decoration: none; }
        a:hover { color: #c9a96e; }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <div class="chamber">
        <h1>🌙 Oneiric</h1>
        <p class="subtitle">(●'◡'●) Welcome back to your Chamber</p>

        <form method="post" action="/login" style="width:100%; display:flex; flex-direction:column; gap:16px;">
            <input type="text" name="username" placeholder="your username" required />
            <input type="password" name="password" placeholder="your password" required />
            <button type="submit">enter</button>
        </form>

        <a href="/register">No account yet? Create your Chamber</a>
    </div>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gold = 'rgba(201, 169, 110,';
        const darkGold = 'rgba(139, 100, 50,';

        // Draw soft cloud puffs in corners
        function drawCloud(x, y, size, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
            grad.addColorStop(0, `rgba(201,169,110,0.25)`);
            grad.addColorStop(1, `rgba(201,169,110,0)`);
            const circles = [
                [0, 0, size],
                [size * 0.6, -size * 0.2, size * 0.75],
                [-size * 0.5, -size * 0.1, size * 0.7],
                [size * 0.2, -size * 0.5, size * 0.6],
                [-size * 0.2, -size * 0.55, size * 0.55],
            ];
            circles.forEach(([cx, cy, r]) => {
                const g = ctx.createRadialGradient(x+cx, y+cy, 0, x+cx, y+cy, r);
                g.addColorStop(0, `rgba(180,140,80,0.18)`);
                g.addColorStop(1, `rgba(180,140,80,0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x + cx, y + cy, r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // Draw sparkle stars
        function drawSparkle(x, y, size, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = `rgba(201,169,110,${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x, y + size);
            ctx.moveTo(x - size, y);
            ctx.lineTo(x + size, y);
            ctx.moveTo(x - size*0.6, y - size*0.6);
            ctx.lineTo(x + size*0.6, y + size*0.6);
            ctx.moveTo(x + size*0.6, y - size*0.6);
            ctx.lineTo(x - size*0.6, y + size*0.6);
            ctx.stroke();
            ctx.restore();
        }

        const w = canvas.width;
        const h = canvas.height;

        // Corner clouds
        drawCloud(0, h, 180, 1);
        drawCloud(w * 0.15, h, 140, 1);
        drawCloud(w, h, 180, 1);
        drawCloud(w * 0.85, h, 140, 1);
        drawCloud(0, 0, 160, 1);
        drawCloud(w * 0.12, 0, 120, 1);
        drawCloud(w, 0, 160, 1);
        drawCloud(w * 0.88, 0, 120, 1);

        // Sparkles scattered around edges
        const sparkles = [
            [w*0.1, h*0.2, 5], [w*0.9, h*0.15, 4], [w*0.05, h*0.7, 6],
            [w*0.95, h*0.75, 5], [w*0.2, h*0.05, 4], [w*0.8, h*0.08, 6],
            [w*0.15, h*0.92, 5], [w*0.85, h*0.9, 4], [w*0.5, h*0.03, 3],
            [w*0.3, h*0.97, 4], [w*0.7, h*0.95, 5], [w*0.02, h*0.45, 4],
            [w*0.98, h*0.5, 5], [w*0.25, h*0.12, 3], [w*0.75, h*0.88, 4],
        ];

        sparkles.forEach(([x, y, s]) => drawSparkle(x, y, s, 0.6));
    </script>
</body>
</html>
