<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Enter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chamber {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            font-size: 2rem;
            color: #c9a96e;
            letter-spacing: 0.2rem;
        }

        p.subtitle {
            color: #9e9589;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #c9a96e;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.1rem;
        }

        button:hover {
            background-color: #b8935a;
        }

        a {
            color: #9e9589;
            font-size: 0.9rem;
            text-decoration: none;
        }

        a:hover { color: #c9a96e; }
    </style>
</head>
<body>
    <div class="chamber">
        <h1>🌙 Oneiric</h1>
        <p class="subtitle">welcome back to your chamber</p>

        <form method="post" action="/login" style="width:100%; display:flex; flex-direction:column; gap:16px;">
            <input type="text" name="username" placeholder="your username" required />
            <input type="password" name="password" placeholder="your password" required />
            <button type="submit">enter</button>
        </form>

        <a href="/register">no account yet? create your chamber</a>
    </div>
</body>
</html>
