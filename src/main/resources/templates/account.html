<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <script>
    // Apply saved theme immediately to prevent flash
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
</script>
    <title>Oneiric — Account</title>
    <style>
    
            :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #555;
            --accent: #c9a96e;
            --accent-hover: #b8935a;
            --accent-dim: rgba(201,169,110,0.08);
            --border: #2e2e2e;
            --border-accent: rgba(201,169,110,0.2);
            --cloud-r: 180; --cloud-g: 140; --cloud-b: 80;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0;
            --bg-secondary: #fff0f3;
            --bg-tertiary: #ffe4ec;
            --text: #4a3040;
            --text-muted: #9e7080;
            --text-subtle: #c4a0b0;
            --accent: #e8829a;
            --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --border: #f0c0d0;
            --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #7090b8;
            --text-subtle: #3a5070;
            --accent: #7eb8e8;
            --accent-hover: #5a9fd4;
            --accent-dim: rgba(126,184,232,0.08);
            --border: #1a2e48;
            --border-accent: rgba(126,184,232,0.2);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180;
        }

        [data-theme="sage"] {
            --bg: #f4f6f0;
            --bg-secondary: #eaefe4;
            --bg-tertiary: #dde5d4;
            --text: #2d3828;
            --text-muted: #6e8060;
            --text-subtle: #a0b090;
            --accent: #7a9e6e;
            --accent-hover: #5e8050;
            --accent-dim: rgba(122,158,110,0.08);
            --border: #c8d8b8;
            --border-accent: rgba(122,158,110,0.3);
            --cloud-r: 122; --cloud-g: 158; --cloud-b: 110;
        }

        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --text-subtle: #444444;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --border: #222222;
            --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
        }
    
       * { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 400px;
    padding: 40px;
}

h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 0.2rem; text-align: center; }
p.subtitle { color: var(--text-muted); font-size: 0.9rem; text-align: center; word-break: break-word; }
p.success { color: #70c970; font-size: 0.9rem; text-align: center; }
p.error { color: #c97070; font-size: 0.9rem; text-align: center; }

input {
    width: 100%;
    padding: 12px 16px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Georgia', serif;
    font-size: 16px; /* prevents iOS Safari auto-zoom on focus */
    outline: none;
}

input:focus { border-color: var(--accent); }

button {
    width: 100%;
    padding: 14px;
    background-color: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    cursor: pointer;
}

button:hover { background-color: var(--accent-hover); }

a.back {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
}

a.back:hover { color: var(--accent); }

@media (max-width: 480px) {
    .container {
        padding: 24px 20px;
        gap: 18px;
    }
    h1 { font-size: 1.5rem; }
    input, button { padding: 13px 14px; }
}
        
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Account</h1>
        <p class="subtitle" th:text="${username}"></p>

        <p class="success" th:if="${success}" th:text="${success}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form method="post" action="/account/password"
              style="width:100%; display:flex; flex-direction:column; gap:16px;">
            <input type="password" name="currentPassword" placeholder="current password" required />
            <input type="password" name="newPassword" placeholder="new password" required />
            <input type="password" name="confirmPassword" placeholder="confirm new password" required />
            <button type="submit">Update Password</button>
        </form>

        <a href="/chamber" class="back">🌙 Back to Chamber</a>
    </div>
</body>
</html>
