<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oneiric — Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        h1 { color: #c9a96e; font-size: 1.8rem; letter-spacing: 0.2rem; }
        p.subtitle { color: #9e9589; font-size: 0.9rem; }
        p.success { color: #70c970; font-size: 0.9rem; }
        p.error { color: #c97070; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #c9a96e; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background-color: #b8935a; }
        a.back {
            color: #9e9589;
            text-decoration: none;
            font-size: 0.85rem;
        }
        a.back:hover { color: #c9a96e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 Account</h1>
        <p class="subtitle" th:text="${username}"></p>

        <p class="success" th:if="${success}" th:text="${success}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form method="post" action="/account/password"
              style="width:100%; display:flex; flex-direction:column; gap:16px;">
            <input type="password" name="currentPassword" placeholder="current password" required />
            <input type="password" name="newPassword" placeholder="new password" required />
            <input type="password" name="confirmPassword" placeholder="confirm new password" required />
            <button type="submit">Update Password</button>
        </form>

        <a href="/chamber" class="back">🌙 Back to Chamber</a>
    </div>
</body>
</html>
