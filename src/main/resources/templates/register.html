<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<script>
    // Apply saved theme immediately to prevent flash
    (function() {
        const t = localStorage.getItem('oneiric-theme');
        if (t && t !== 'default') document.documentElement.setAttribute('data-theme', t);
    })();
</script>
    <meta charset="UTF-8">
    <title>Oneiric — Register</title>
    <style>
    
            :root {
            --bg: #0d0d0d;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text: #e8e0d0;
            --text-muted: #9e9589;
            --text-subtle: #555;
            --accent: #c9a96e;
            --accent-hover: #b8935a;
            --accent-dim: rgba(201,169,110,0.08);
            --border: #2e2e2e;
            --border-accent: rgba(201,169,110,0.2);
            --cloud-r: 180; --cloud-g: 140; --cloud-b: 80;
        }

        [data-theme="sakura"] {
            --bg: #fdf6f0;
            --bg-secondary: #fff0f3;
            --bg-tertiary: #ffe4ec;
            --text: #4a3040;
            --text-muted: #9e7080;
            --text-subtle: #c4a0b0;
            --accent: #e8829a;
            --accent-hover: #d4607a;
            --accent-dim: rgba(232,130,154,0.08);
            --border: #f0c0d0;
            --border-accent: rgba(232,130,154,0.3);
            --cloud-r: 232; --cloud-g: 130; --cloud-b: 154;
        }

        [data-theme="abyss"] {
            --bg: #050d1a;
            --bg-secondary: #0a1628;
            --bg-tertiary: #0f1e35;
            --text: #c8d8f0;
            --text-muted: #7090b8;
            --text-subtle: #3a5070;
            --accent: #7eb8e8;
            --accent-hover: #5a9fd4;
            --accent-dim: rgba(126,184,232,0.08);
            --border: #1a2e48;
            --border-accent: rgba(126,184,232,0.2);
            --cloud-r: 60; --cloud-g: 100; --cloud-b: 180;
        }

        [data-theme="sage"] {
            --bg: #f4f6f0;
            --bg-secondary: #eaefe4;
            --bg-tertiary: #dde5d4;
            --text: #2d3828;
            --text-muted: #6e8060;
            --text-subtle: #a0b090;
            --accent: #7a9e6e;
            --accent-hover: #5e8050;
            --accent-dim: rgba(122,158,110,0.08);
            --border: #c8d8b8;
            --border-accent: rgba(122,158,110,0.3);
            --cloud-r: 122; --cloud-g: 158; --cloud-b: 110;
        }

        [data-theme="noir"] {
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --text-subtle: #444444;
            --accent: #ffffff;
            --accent-hover: #cccccc;
            --accent-dim: rgba(255,255,255,0.05);
            --border: #222222;
            --border-accent: rgba(255,255,255,0.15);
            --cloud-r: 200; --cloud-g: 200; --cloud-b: 200;
        }
    
        * { margin: 0; padding: 0; box-sizing: border-box; }

               body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .chamber {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 { font-size: 2rem; color: #c9a96e; letter-spacing: 0.2rem; }
        p.subtitle { color: #9e9589; font-size: 0.9rem; }
        p.error { color: #c97070; font-size: 0.9rem; }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 6px;
            color: #e8e0d0;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: #c9a96e; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #c9a96e;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.1rem;
        }

        button:hover { background-color: #b8935a; }
        a { color: #9e9589; font-size: 0.9rem; text-decoration: none; }
        a:hover { color: #c9a96e; }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <div class="chamber">
        <h1>🌙 Oneiric</h1>
        <p class="subtitle">Create your Secret Chamber</p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form method="post" action="/register" style="width:100%; display:flex; flex-direction:column; gap:16px;">
            <input type="text" name="username" placeholder="choose a username" required />
            <input type="email" name="email" placeholder="your email" required />
            <input type="password" name="password" placeholder="create a password" required />
            <button type="submit">Enter Chamber</button>
        </form>

        <a href="/login">Already have an Account? Enter here</a>
    </div>

    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const w = canvas.width;
        const h = canvas.height;

        function drawCloud(x, y, size) {
            const circles = [
                [0, 0, size],
                [size*0.6, -size*0.2, size*0.75],
                [-size*0.5, -size*0.1, size*0.7],
                [size*0.2, -size*0.5, size*0.6],
                [-size*0.2, -size*0.55, size*0.55],
            ];
            circles.forEach(([cx, cy, r]) => {
                const g = ctx.createRadialGradient(x+cx, y+cy, 0, x+cx, y+cy, r);
                g.addColorStop(0, `rgba(180,140,80,0.18)`);
                g.addColorStop(1, `rgba(180,140,80,0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x+cx, y+cy, r, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawSparkle(x, y, size, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = `rgba(201,169,110,${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y-size); ctx.lineTo(x, y+size);
            ctx.moveTo(x-size, y); ctx.lineTo(x+size, y);
            ctx.moveTo(x-size*0.6, y-size*0.6); ctx.lineTo(x+size*0.6, y+size*0.6);
            ctx.moveTo(x+size*0.6, y-size*0.6); ctx.lineTo(x-size*0.6, y+size*0.6);
            ctx.stroke();
            ctx.restore();
        }

        drawCloud(0, h, 180);
        drawCloud(w*0.15, h, 140);
        drawCloud(w, h, 180);
        drawCloud(w*0.85, h, 140);
        drawCloud(0, 0, 160);
        drawCloud(w*0.12, 0, 120);
        drawCloud(w, 0, 160);
        drawCloud(w*0.88, 0, 120);

        [[w*0.1,h*0.2,5],[w*0.9,h*0.15,4],[w*0.05,h*0.7,6],
         [w*0.95,h*0.75,5],[w*0.2,h*0.05,4],[w*0.8,h*0.08,6],
         [w*0.15,h*0.92,5],[w*0.85,h*0.9,4],[w*0.5,h*0.03,3],
         [w*0.3,h*0.97,4],[w*0.7,h*0.95,5],[w*0.02,h*0.45,4]
        ].forEach(([x,y,s]) => drawSparkle(x, y, s, 0.6));
    </script>
</body>
</html>
